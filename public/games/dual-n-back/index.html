<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#494b57">
  <title>Dual N-Back Training</title>
  <style>:root{--calc-housing:#494b57;--calc-display:#2b2d39;--calc-number:#2a303c;--calc-petrol:#00789a;--calc-teal:#12a49a;--calc-red:#ce4454;--calc-orange:#e79e35;--calc-violet:#86509b;--calc-ink:#ecedf1;}

    :root {
      color-scheme: light;
      --page: var(--calc-ink);
      --surface: var(--calc-ink);
      --ink: var(--calc-display);
      --muted: var(--calc-housing);
      --line: var(--calc-ink);
      --accent: var(--calc-housing);
      --accent-dark: var(--calc-number);
      --stimulus: var(--calc-ink);
      --cell: var(--calc-ink);
      --danger: var(--calc-red);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 18px 40px;
      background: var(--page);
      color: var(--ink);
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .shell { width: min(100%, 680px); margin: 0 auto; }
    .site-title { margin: 0 0 22px; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
    .panel {
      padding: clamp(22px, 5vw, 40px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
    }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(25px, 5vw, 34px); line-height: 1.15; letter-spacing: -.035em; }
    h2 { margin-bottom: 18px; font-size: 22px; letter-spacing: -.02em; }
    .intro, .muted { color: var(--muted); }
    .intro { max-width: 470px; margin-bottom: 30px; line-height: 1.55; }
    .field-label { display: block; margin-bottom: 10px; font-weight: 650; }
    .level-choice { display: flex;flex-wrap:wrap; gap: 10px; margin: 0 0 26px; }
    .level-choice label { position: relative; flex: 1;min-width:0; cursor: pointer; }
    .level-choice input { position: absolute; opacity: 0; inset: 0; }
    .level-choice .level-extra{flex:0 0 100%}
    .level-choice span {
      display: block; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
      text-align: center; font-weight: 600;
    }
    .level-choice input:checked + span { border-color: var(--accent); background: var(--calc-ink); color: var(--accent-dark); }
    .level-choice input:focus-visible + span { outline: 3px solid var(--calc-ink); outline-offset: 2px; }
    .primary, .answer, .secondary {
      min-height: 52px; border: 0; border-radius: 8px; font-weight: 650; cursor: pointer;
    }
    .primary { width: 100%; padding: 13px 20px; background: var(--accent); color: var(--calc-ink); }
    .primary:hover { background: var(--accent-dark); }
    .primary:focus-visible, .answer:focus-visible, .secondary:focus-visible { outline: 3px solid var(--calc-ink); outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .48; }
    .game-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin-bottom: 22px; }
    .game-head h1 { margin: 0; font-size: 25px; }
    .counter { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
    .grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
      width: min(100%, 390px); margin: 0 auto 25px; aspect-ratio: 1;
    }
    .cell { border-radius: 9px; background: var(--cell); }
    .cell.active { background: var(--stimulus);position:relative;box-shadow:inset 0 0 0 3px var(--calc-ink); }
    .level-choice span{box-shadow:inset 0 -3px 0 var(--calc-orange)}
    .level-choice input:disabled+span{opacity:.48;cursor:not-allowed}
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .answer { min-height:clamp(72px,15vh,140px); font-size:24px; padding: 12px 10px; border: 1px solid var(--line); background: var(--calc-ink); color: var(--ink); }
    .answer:enabled:hover { border-color: var(--line); background: var(--surface); }
    .answer small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .result-lead { margin-bottom: 24px; color: var(--muted); }
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
    .score-card { padding: 16px; border: 1px solid var(--line); border-radius: 9px; }
    .score-card h3 { margin: 0 0 11px; font-size: 16px; }
    .score-card dl { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin: 0; color: var(--muted); font-size: 14px; }
    .score-card dd { margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
    .total-errors { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-weight: 650; }
    .outcome { margin: 18px 0 22px; font-size: 18px; font-weight: 700; }
    .outcome.fail { color: var(--danger); }
    .next-step { margin: -12px 0 24px; color: var(--muted); line-height: 1.5; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .secondary { padding: 12px 14px; border: 1px solid var(--line); background: white; color: var(--ink); }
    .secondary:hover { border-color: var(--accent); }
    .hidden { display: none !important; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 480px) {
      body { padding: 19px 12px 28px; }
      .game-head { display: block; }
      .counter { margin-top: 7px; }
      .grid { gap: 7px; margin-bottom: 18px; }
      .answers, .score-grid, .actions { grid-template-columns: 1fr; }
    }
    body{padding:12px;min-width:0}.site-title{display:none}.panel{padding:clamp(12px,3vw,26px)}
    .game-head{display:flex;align-items:center;margin-bottom:12px;gap:8px}.game-head h1{margin:0;flex:1}.game-head .counter{font-size:13px;margin:0}.game-head .secondary{min-height:44px;padding:8px 12px}
    .grid{width:min(100%,390px,calc(100dvh - 185px));margin-bottom:12px;gap:7px}
    .answers{grid-template-columns:1fr 1fr;gap:8px}.answer{min-height:clamp(72px,16dvh,140px);font-size:24px;padding:10px 4px}
    .intro{margin-bottom:18px}.level-choice{margin-bottom:14px}#soundTest{min-height:44px}#audioNotice{font-size:14px;line-height:1.4}
    .pause-overlay{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--page) 95%,transparent);display:grid;place-items:center;padding:16px}.pause-overlay .panel{width:min(100%,420px)}
    @media(max-height:380px) and (min-width:500px){#gameView{display:grid;grid-template-columns:1fr 1fr;gap:8px}.game-head{grid-column:1/-1}.grid{grid-column:1;grid-row:2;width:min(100%,calc(100dvh - 110px));margin:0 auto}.answers{grid-column:2;align-content:center;grid-template-columns:1fr}.answer{min-height:52px}}

    :root{--page:var(--calc-display);--surface:var(--calc-housing);--ink:var(--calc-ink);--muted:var(--calc-ink);--accent:var(--calc-violet);--accent-dark:var(--calc-housing);--line:var(--calc-violet);--cell:var(--calc-number);--stimulus:var(--calc-teal);--danger:var(--calc-ink);color-scheme:dark}
    .answer,.secondary,.total-errors{background:var(--surface);color:var(--ink)}.level-choice input:checked+span{background:var(--cell);color:var(--ink)}
    .primary{color:var(--page)}.outcome,.next-step{color:var(--ink)}
    :root[data-theme="retro-tech"]{--page:var(--calc-display);--surface:var(--calc-housing);--ink:var(--calc-ink);--muted:var(--calc-ink);--accent:var(--calc-violet);--line:var(--calc-housing);--cell:var(--calc-number);--stimulus:var(--calc-violet);color-scheme:dark}
    .primary:hover{background:var(--accent);filter:brightness(1.1)}.panel{padding:20px}
    .primary{color:var(--calc-ink)}.outcome.fail{color:var(--ink)}
:root[data-theme="pink"]{color-scheme:light}.primary{margin-top:8px}:root[data-theme="pink"] .primary{color:var(--calc-ink)}:root[data-theme="pink"] .answer{background:var(--surface);color:var(--ink)}
:root[data-compact=true] .panel{padding:12px}:root[data-compact=true] h1{font-size:1.75rem}:root[data-compact=true] p{margin-block:8px}:root[data-compact=true] button{padding:8px 12px;min-height:44px}
.primary{background:var(--action-main,var(--accent));color:var(--action-main-ink,var(--ink))}.secondary{background:var(--action-selection,var(--surface));color:var(--action-selection-ink,var(--ink))}#pauseButton{background:var(--action-neutral,var(--surface));color:var(--action-neutral-ink,var(--ink))}
.answer.input-feedback,.answer.input-feedback:enabled:hover{border-color:var(--calc-orange);box-shadow:inset 0 0 0 2px var(--calc-orange)}
.answer:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
  <main class="shell">
    <p class="site-title">Dual N-Back Training</p>

    <section id="startView" class="panel" aria-labelledby="startTitle">
      <h1 id="startTitle">Dual N-Back Training</h1>
      <p class="intro">Merke dir die Position im Raster und den gesprochenen Buchstaben. Reagiere, wenn einer davon dem Reiz vor N Schritten entspricht.</p>
      <span class="field-label" id="levelLabel">Anfangsstufe</span>
      <div class="level-choice" role="radiogroup" aria-labelledby="levelLabel">
        <label><input type="radio" name="startLevel" value="1" checked><span>1-Back</span></label>
        <label><input type="radio" name="startLevel" value="2"><span>2-Back</span></label><label><input type="radio" name="startLevel" value="3" disabled><span>3-Back</span></label><label class="level-extra hidden"><input type="radio" name="startLevel" value="4"><span>4-Back</span></label>
      </div>
      <button class="secondary" id="soundTest" type="button">Ton testen</button><p id="audioNotice" role="status"></p><button class="primary" id="startButton" type="button">Training starten</button>
    </section>

    <section id="gameView" class="panel hidden" aria-label="Laufende Runde">
      <div class="game-head">
        <h1 id="gameLevel">1-Back</h1>
        <button class="secondary" id="pauseButton" type="button">Pause</button><p class="counter" id="counter" aria-live="off">Durchgang 0 / 24</p>
      </div>
      <div class="grid" id="grid" aria-label="3 mal 3 Raster">
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
      <div class="answers">
        <button class="answer" id="positionButton" type="button">Position</button>
        <button class="answer" id="audioButton" type="button">Audio</button>
      </div>
    </section>

    <section id="resultView" class="panel hidden" aria-labelledby="resultTitle" aria-live="polite"></section>
  </main>

    window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===parent&&event.data?.type==='lernkick:theme'){document.documentElement.dataset.theme=event.data.theme;document.documentElement.dataset.compact=String(Boolean(event.data.compact));for(const key of ['--action-main','--action-main-ink','--action-selection','--action-selection-ink','--action-neutral','--action-neutral-ink','--page','--surface','--ink','--muted','--accent','--line','--cell','--stimulus','--calc-housing','--calc-display','--calc-number','--calc-petrol','--calc-teal','--calc-red','--calc-orange','--calc-violet','--calc-ink'])if(typeof event.data.palette?.[key]==='string')document.documentElement.style.setProperty(key,event.data.palette[key]);}});
    const CONFIG = Object.freeze({
      scoredTrials: 24,
      maxErrorsForPromotion: 2,
      stimulusDuration: 500,
      trialDuration: 3000,
      letters: ["T", "M", "F", "S", "K", "W", "Z", "R", "Q"],
      spokenLetters: { T: "te", M: "em", F: "ef", S: "es", K: "ka", W: "we", Z: "zett", R: "er", Q: "ku" }
    });

    // Feste, eingebettete Aufnahmen sorgen auf jedem Gerät für dieselbe Aussprache.
    const letterAudio = Object.fromEntries(Object.entries(EMBEDDED_LETTER_AUDIO).map(([letter, source]) => {
      const audio = new Audio(source);
      audio.preload = "auto";
      return [letter, audio];
    }));

    const state = {
      level: null,
      started: false,
      running: false,
      roundToken: 0,
      history: [],
      highestLevel: null
    };

    const startView = document.getElementById("startView");
    const gameView = document.getElementById("gameView");
    const resultView = document.getElementById("resultView");
    const gridCells = Array.from(document.querySelectorAll(".cell"));
    const counter = document.getElementById("counter");
    const audioButton = document.getElementById("audioButton");
    const positionButton = document.getElementById("positionButton");

    function showView(view) {
      startView.classList.toggle("hidden", view !== startView);
      gameView.classList.toggle("hidden", view !== gameView);
      resultView.classList.toggle("hidden", view !== resultView);
    }

    function shuffle(items) {
      const result = items.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function pickDifferent(pool, previous) {
      const choices = pool.filter(value => value !== previous);
      return choices[Math.floor(Math.random() * choices.length)];
    }

    // Erst Match-Muster verteilen, danach passende Reize einsetzen. So entstehen
    // kontrollierte Häufigkeiten ohne unbeabsichtigte N-Back-Übereinstimmungen.
    function generateSequence(level) {
      const total = CONFIG.scoredTrials + level;
      const doubleCount = 1 + Math.floor(Math.random() * 2);
      const audioCount = 5 + Math.floor(Math.random() * 3);
      const positionCount = 5 + Math.floor(Math.random() * 3);
      const scoredIndexes = shuffle(Array.from({ length: CONFIG.scoredTrials }, (_, i) => i + level));
      const doubleIndexes = scoredIndexes.slice(0, doubleCount);
      const audioOnlyIndexes = scoredIndexes.slice(doubleCount, doubleCount + audioCount - doubleCount);
      const positionOnlyIndexes = scoredIndexes.slice(doubleCount + audioCount - doubleCount, doubleCount + audioCount - doubleCount + positionCount - doubleCount);
      const audioIndexes = new Set([...doubleIndexes, ...audioOnlyIndexes]);
      const positionIndexes = new Set([...doubleIndexes, ...positionOnlyIndexes]);

      const sequence = [];
      for (let i = 0; i < total; i += 1) {
        if (i < level) {
          sequence.push({ letter: CONFIG.letters[Math.floor(Math.random() * CONFIG.letters.length)], position: Math.floor(Math.random() * 9), scored: false, audioMatch: false, positionMatch: false, answers: { audio: false, position: false } });
          continue;
        }
        const audioMatch = audioIndexes.has(i);
        const positionMatch = positionIndexes.has(i);
        const prior = sequence[i - level];
        const letter = audioMatch ? prior.letter : pickDifferent(CONFIG.letters, prior.letter);
        const position = positionMatch ? prior.position : pickDifferent([0,1,2,3,4,5,6,7,8], prior.position);
        sequence.push({ letter, position, scored: true, audioMatch, positionMatch, answers: { audio: false, position: false } });
      }
      return sequence;
    }

    function speakLetter(letter) {
      if(paused){pendingLetter=letter;return;}
      const audio = letterAudio[letter];
      audio.pause();
      audio.currentTime = 0;
      audio.play().catch(() => {
        document.getElementById("audioNotice").textContent = "Falls du keinen Ton hörst: Lautstärke und Browser-Tonfreigabe prüfen.";
        // Kompatibilitätsfallback, falls ein Browser eingebettetes Audio blockiert.
        if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(CONFIG.spokenLetters[letter]);
        utterance.lang = "de-DE";
        utterance.rate = 0.9;
        const voices = window.speechSynthesis.getVoices();
        const germanVoice = voices.find(voice => voice.lang.toLowerCase() === "de-de") || voices.find(voice => voice.lang.toLowerCase().startsWith("de"));
        if (germanVoice) utterance.voice = germanVoice;
        window.speechSynthesis.speak(utterance);
      });
    }

    const answerFeedbackTimers=new Map();
    function clearAnswerFeedback(){for(const button of [audioButton,positionButton]){clearTimeout(answerFeedbackTimers.get(button));button.classList.remove('input-feedback');}answerFeedbackTimers.clear();}
    function flashAnswer(kind){const button=kind==='audio'?audioButton:positionButton;clearTimeout(answerFeedbackTimers.get(button));button.classList.add('input-feedback');answerFeedbackTimers.set(button,setTimeout(()=>{button.classList.remove('input-feedback');answerFeedbackTimers.delete(button);},200));}
    function setAnswerButtons(enabled) {
      clearAnswerFeedback();
      audioButton.disabled = !enabled;
      positionButton.disabled = !enabled;
    }

    function registerAnswer(kind) {
      if (!state.running || paused) return;
      const round = state.currentRound;
      const trial = round && round.sequence[round.index];
      if (!trial || !trial.scored) return;
      flashAnswer(kind);
      if(trial.answers[kind])return;
      trial.answers[kind] = true;
      saveRound();
    }

    function saveRound(){if(state.running&&state.currentRound)try{localStorage.setItem('lernkick.nback.round.v1',JSON.stringify({...state.currentRound,remaining:pendingWait?Math.max(0,pendingWait.remaining-(paused?0:performance.now()-pendingWait.started)):undefined}));}catch{}}
    window.lernkickSuspendRound=()=>{if(state.running){pauseGame(true);saveRound();}};
    window.lernkickEndRound=()=>{clearAnswerFeedback();state.running=false;state.roundToken++;clearTimeout(pendingWait?.timer);Object.values(letterAudio).forEach(audio=>audio.pause());if('speechSynthesis' in window)speechSynthesis.cancel();try{localStorage.removeItem('lernkick.nback.round.v1');}catch{}};
    window.addEventListener('pagehide',saveRound);
    let paused = false, parentPaused = false, pendingWait = null, pendingLetter = null;
    const pauseOverlay = document.createElement('div');
    pauseOverlay.className='pause-overlay hidden';
    pauseOverlay.innerHTML='<section class="panel"><h2>Pause</h2><p>Deine laufende Runde bleibt stehen.</p><button class="primary" type="button">Weiter spielen</button></section>';
    document.body.append(pauseOverlay);
    function announceRunning(running){if(parent!==window)parent.postMessage({type:'lernkick:nback-state',level:state.level,running},location.origin);}
    function resumeWait(){if(!pendingWait||paused)return;const w=pendingWait;w.started=performance.now();w.timer=setTimeout(()=>{pendingWait=null;w.resolve();},w.remaining);}
    function pauseGame(value){
      if(value===paused)return;
      if(value)saveRound();
      paused=value;
      if(paused){
        clearAnswerFeedback();
        if(pendingWait){clearTimeout(pendingWait.timer);pendingWait.remaining=Math.max(0,pendingWait.remaining-(performance.now()-pendingWait.started));}
        Object.values(letterAudio).forEach(audio=>audio.pause());
        if('speechSynthesis' in window)speechSynthesis.cancel();
      }else{resumeWait();if(pendingLetter){const letter=pendingLetter;pendingLetter=null;speakLetter(letter);}}
      pauseOverlay.classList.toggle('hidden',!paused);
      pauseOverlay.querySelector('button').disabled=parentPaused;
    }
    pauseOverlay.querySelector('button').addEventListener('click',()=>{if(!parentPaused&&!document.hidden)pauseGame(false);});
    document.getElementById('pauseButton').addEventListener('click',()=>pauseGame(true));
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running)pauseGame(true);});
    window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='lernkick:nback-pause')return;const wasParentPaused=parentPaused;parentPaused=Boolean(event.data.paused);if(state.running&&parentPaused)pauseGame(true);else if(state.running&&wasParentPaused&&!document.hidden)pauseGame(false);});
    window.addEventListener('pagehide',()=>{clearAnswerFeedback();state.roundToken++;Object.values(letterAudio).forEach(audio=>audio.pause());if('speechSynthesis' in window)speechSynthesis.cancel();clearTimeout(pendingWait?.timer);});
    document.getElementById('soundTest').addEventListener('click',()=>speakLetter('T'));
    function wait(ms){return new Promise(resolve=>{pendingWait={resolve,remaining:ms,started:performance.now(),timer:null};resumeWait();});}


    async function playRound(level, saved=null) {
      state.roundToken += 1;
      const token = state.roundToken;
      const round = saved || { resultId:crypto.randomUUID(), level, sequence: generateSequence(level), index: 0, startedAt: Date.now() };
      state.currentRound = round;
      state.level = level;
      state.running = true;
      announceRunning(true);
      document.getElementById("gameLevel").textContent = `${level}-Back`;
      showView(gameView);

      const resumeIndex=round.index,resumePhase=saved?.phase,resumeRemaining=saved?.remaining;
      for (let index = round.index; index < round.sequence.length; index += 1) {
        if (token !== state.roundToken) return;
        round.index = index;
        const trial = round.sequence[index];
        counter.textContent = `Durchgang ${Math.max(0, index - level + 1)} / ${CONFIG.scoredTrials}`;
        setAnswerButtons(trial.scored);
        const resuming=Boolean(saved)&&index===resumeIndex;
        if(!resuming||resumePhase!=='gap') {
          round.phase='stimulus';saveRound();
          gridCells.forEach((cell, cellIndex) => cell.classList.toggle("active", cellIndex === trial.position));
          speakLetter(trial.letter);
          await wait(resuming&&resumePhase==='stimulus'&&Number.isFinite(resumeRemaining)?resumeRemaining:CONFIG.stimulusDuration);
          if (token !== state.roundToken) return;
        }
        gridCells.forEach(cell => cell.classList.remove("active"));
        round.phase='gap';saveRound();
        await wait(resuming&&resumePhase==='gap'&&Number.isFinite(resumeRemaining)?resumeRemaining:Math.max(0, CONFIG.trialDuration - CONFIG.stimulusDuration));
      }

      if (token !== state.roundToken) return;
      state.running = false;
      try{localStorage.removeItem("lernkick.nback.round.v1");}catch{}
      announceRunning(false);
      setAnswerButtons(false);
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      showResults(round);
    }

    function evaluateRound(round) {
      const scored = round.sequence.filter(trial => trial.scored);
      const stats = {
        audio: { hits: 0, missed: 0, falseAlarms: 0 },
        position: { hits: 0, missed: 0, falseAlarms: 0 }
      };
      for (const trial of scored) {
        for (const [kind, matchKey] of [["audio", "audioMatch"], ["position", "positionMatch"]]) {
          if (trial[matchKey] && trial.answers[kind]) stats[kind].hits += 1;
          else if (trial[matchKey]) stats[kind].missed += 1;
          else if (trial.answers[kind]) stats[kind].falseAlarms += 1;
        }
      }
      const errors = stats.audio.missed + stats.audio.falseAlarms + stats.position.missed + stats.position.falseAlarms;
      return { stats, errors, passed: errors <= CONFIG.maxErrorsForPromotion };
    }

    function showResults(round) {
      const outcome = evaluateRound(round);
      const nextLevel = outcome.passed ? Math.min(4, round.level + 1) : round.level;
      const highestLevel = Math.max(state.highestLevel || round.level, nextLevel);
      state.level = nextLevel;
      state.highestLevel = highestLevel;
      const record = { level: round.level, ...outcome, nextLevel, highestLevel, date: new Date() };
      state.history.push(record);
      if(parent!==window)parent.postMessage({type:'lernkick:nback-result',level:round.level,id:round.resultId||(round.resultId=crypto.randomUUID()),errors:outcome.errors,hits:outcome.stats.audio.hits+outcome.stats.position.hits,missed:outcome.stats.audio.missed+outcome.stats.position.missed,falseAlarms:outcome.stats.audio.falseAlarms+outcome.stats.position.falseAlarms,responses:round.sequence.reduce((n,t)=>n+Number(t.answers.audio)+Number(t.answers.position),0)},location.origin);
      resultView.innerHTML = "";

      const title = document.createElement("h1");
      title.id = "resultTitle";
      title.textContent = `${round.level}-Back`;
      resultView.append(title);
      const lead = document.createElement("p");
      lead.className = "result-lead";
      lead.textContent = "Rundenauswertung";
      resultView.append(lead);

      const total = document.createElement("div");
      total.className = "total-errors";
      total.innerHTML = `<span>Gesamtfehler</span><span>${outcome.errors}</span>`;
      resultView.append(total);

      const outcomeText = document.createElement("p");
      outcomeText.className = `outcome${outcome.passed ? "" : " fail"}`;
      outcomeText.textContent = outcome.passed ? "Bestanden" : "Nicht bestanden";
      resultView.append(outcomeText);

      const next = document.createElement("p");
      next.className = "next-step";
      if (outcome.passed && round.level === 4) next.textContent = "Training auf der höchsten Stufe abgeschlossen. Du kannst weiter auf 4-Back trainieren.";
      else if (outcome.passed) next.textContent = `Nächste Stufe: ${nextLevel}-Back`;
      else next.textContent = `Die Stufe bleibt bei ${round.level}-Back.`;
      resultView.append(next);

      const actions = document.createElement("div");
      actions.className = "actions";
      const again = document.createElement("button");
      again.className = "primary";
      again.type = "button";
      again.textContent = "Neue Runde";
      again.addEventListener("click", () => playRound(state.level));
      actions.append(again);
      resultView.append(actions);
      showView(resultView);
    }

    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==parent||event.data?.type!=='lernkick:nback-progress')return;const mastered=Array.isArray(event.data.mastered)?event.data.mastered:[];const extra=mastered.includes(3)||event.data.current===4;document.querySelector('.level-extra').classList.toggle('hidden',!extra);document.querySelectorAll('input[name="startLevel"]').forEach(input=>{input.nextElementSibling.classList.toggle('mastered',mastered.includes(Number(input.value)));const locked=Number(input.value)===3&&!mastered.includes(2);input.disabled=state.running||locked;if(!state.running&&!locked&&Number(input.value)===event.data.current&&(Number(input.value)<=3||extra))input.checked=true;});if(!state.running&&document.querySelector('input[name="startLevel"]:checked')?.disabled)document.querySelector('input[name="startLevel"][value="2"]').checked=true;});
    document.getElementById("startButton").addEventListener("click", () => {
      const choice=document.querySelector('input[name="startLevel"]:checked');if(!choice||choice.disabled)return;
      const selected = Number(choice.value);
      state.started = true;
      state.level = selected;
      state.highestLevel = selected;
      document.querySelectorAll('input[name="startLevel"]').forEach(input => { input.disabled = true; });
      playRound(state.level);
    });
    function bindAnswerButton(button,kind){
      // Do not require isPrimary: each finger must register its own answer.
      button.addEventListener('pointerdown',event=>{
        if(event.button!==0||button.disabled)return;
        if(event.pointerType==='touch')event.preventDefault();
        registerAnswer(kind);
      });
      // Keyboard/assistive activation has no pointerdown. Ignore the subsequent
      // pointer click so releasing a held touch cannot restart its feedback.
      button.addEventListener('click',event=>{if(event.detail===0)registerAnswer(kind);});
    }
    bindAnswerButton(audioButton,'audio');
    bindAnswerButton(positionButton,'position');
    window.addEventListener("keydown", event => {
      if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key.toLowerCase() === "a") { event.preventDefault(); registerAnswer("audio"); }
      if (event.key.toLowerCase() === "l") { event.preventDefault(); registerAnswer("position"); }
    });
    try {
      const saved=JSON.parse(localStorage.getItem('lernkick.nback.round.v1')||'null');
      if(saved&&Number.isInteger(saved.level)&&saved.level>=1&&saved.level<=4&&Array.isArray(saved.sequence)&&saved.sequence.length===24+saved.level&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<saved.sequence.length&&saved.sequence.every(t=>CONFIG.letters.includes(t.letter)&&Number.isInteger(t.position)&&t.position>=0&&t.position<9&&typeof t.answers?.audio==='boolean'&&typeof t.answers?.position==='boolean')) {
        pauseGame(true);playRound(saved.level,saved);
      }
    } catch {}
  </script>
</body>
</html>
