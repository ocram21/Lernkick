<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1188.3999999999999" viewBox="0 0 800 1188.3999999999999" role="img"><title>Satz des Pythagoras</title><desc>Gilt nur im rechtwinkligen Dreieck. Die Hypotenuse c liegt dem rechten Winkel gegenüber.</desc><rect width="800" height="1188.3999999999999" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Satz des Pythagoras</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Gilt nur im rechtwinkligen Dreieck. Die Hypotenuse c liegt dem</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">rechten Winkel gegenüber.</text><g transform="translate(0 50)"><path d="M90 340V100L270 340Z" fill="#dfedf1" stroke="#32627c" stroke-width="4"/><path d="M90 315H115V340" fill="none" stroke="#32627c" stroke-width="3"/><text x="5" y="250" fill="#263440" font-size="19" font-weight="400">b = 4 cm</text><text x="135" y="375" fill="#263440" font-size="22" font-weight="400">a = 3 cm</text><text x="195" y="225" fill="#263440" font-size="22" font-weight="400">c = 5 cm</text><text x="400" y="195" fill="#196246" font-size="31" font-weight="700">3² + 4² = 5²</text><text x="400" y="250" fill="#263440" font-size="28" font-weight="400">9 + 16 = 25</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Die Regel</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">a und b bilden den rechten Winkel. c ist die längste</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Seite.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">a² + b² = c²</text><rect x="40" y="629.4" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Beispiel: a = 3 cm, b = 4 cm</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">3² + 4² = 9 + 16 = 25. Die Wurzel aus 25 ist 5.</text><text x="58" y="748.6" fill="#196246" font-size="24" font-weight="600">c = √25 = 5 cm</text><rect x="40" y="787.5999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="823.5999999999999" fill="#214d7c" font-size="28" font-weight="700">Eine Kathete berechnen</text><text x="58" y="863.5999999999999" fill="#263440" font-size="24" font-weight="400">Ist c bekannt, ziehst du das Quadrat der anderen</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">Kathete ab.</text><text x="58" y="937.9999999999999" fill="#196246" font-size="24" font-weight="600">a = √(c²−b²)</text><rect x="40" y="976.9999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1012.9999999999999" fill="#214d7c" font-size="28" font-weight="700">Einheiten prüfen</text><text x="58" y="1053" fill="#263440" font-size="24" font-weight="400">Alle Seiten vor dem Rechnen in dieselbe Längeneinheit</text><text x="58" y="1084.2" fill="#263440" font-size="24" font-weight="400">umwandeln.</text><text x="58" y="1127.4" fill="#196246" font-size="24" font-weight="600">3 cm, 4 cm, 5 cm</text></g></svg>