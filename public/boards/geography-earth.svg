<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1197.2" viewBox="0 0 800 1197.2" role="img"><title>Erdaufbau, Vulkane und Erdbeben</title><desc>Die äußere feste Erde ist in Platten gegliedert, die sich sehr langsam bewegen.</desc><rect width="800" height="1197.2" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Erdaufbau, Vulkane und Erdbeben</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Die äußere feste Erde ist in Platten gegliedert, die sich sehr</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">langsam bewegen.</text><g transform="translate(0 50)"><circle cx="145" cy="220" r="77" fill="#8e6850"/><circle cx="145" cy="220" r="69" fill="#dd9c65"/><circle cx="145" cy="220" r="35" fill="#f4cf65"/><circle cx="145" cy="220" r="16" fill="#fff2ae"/><text x="55" y="130" fill="#263440" font-size="24" font-weight="700">Erdschichten</text><text x="35" y="330" fill="#263440" font-size="18" font-weight="400">Kruste → Mantel → Kern</text><text x="290" y="130" fill="#263440" font-size="24" font-weight="700">Plattengrenze</text><path d="M290 240H380L390 265H290Z M415 240H505V265H405Z" fill="#8e6850"/><text x="320" y="218" fill="#263440" font-size="32" font-weight="400">←</text><text x="450" y="218" fill="#263440" font-size="32" font-weight="400">→</text><text x="285" y="330" fill="#263440" font-size="18" font-weight="400">Beispiel: auseinander</text><text x="580" y="130" fill="#263440" font-size="24" font-weight="700">Vulkan</text><path d="M540 280L610 185L620 195L630 185L705 280Z" fill="#9b8877" stroke="#62574d" stroke-width="2"/><ellipse cx="620" cy="290" rx="36" ry="18" fill="#e49360"/><path d="M620 285V205L631 193L650 220" stroke="#d65a3e" stroke-width="8" fill="none"/><text x="552" y="330" fill="#263440" font-size="18" font-weight="400">Magma → Lava</text><text x="95" y="373" fill="#263440" font-size="18" font-weight="400">Schematisch; Größen und Abstände nicht maßstäblich</text></g><rect x="40" y="440" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Schichten</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Außen die dünne Erdkruste; darunter der überwiegend</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">feste, aber langfristig verformbare Mantel. Der äußere</text><text x="58" y="578.4" fill="#263440" font-size="24" font-weight="400">Kern ist flüssig, der innere fest.</text><rect x="40" y="631.6" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="667.6" fill="#214d7c" font-size="28" font-weight="700">Plattengrenzen</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">Platten können auseinanderdriften, zusammenstoßen oder</text><text x="58" y="738.8000000000001" fill="#263440" font-size="24" font-weight="400">aneinander vorbeigleiten.</text><rect x="40" y="792" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="828" fill="#214d7c" font-size="28" font-weight="700">Vulkane</text><text x="58" y="868" fill="#263440" font-size="24" font-weight="400">Magma ist Gesteinsschmelze im Erdinneren; an der</text><text x="58" y="899.2" fill="#263440" font-size="24" font-weight="400">Oberfläche heißt sie Lava. Vulkane entstehen oft an</text><text x="58" y="930.4" fill="#263440" font-size="24" font-weight="400">Plattengrenzen, aber auch über Hotspots.</text><rect x="40" y="983.6" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1019.6" fill="#214d7c" font-size="28" font-weight="700">Erdbeben</text><text x="58" y="1059.6" fill="#263440" font-size="24" font-weight="400">Spannungen im Gestein können sich plötzlich lösen. Das</text><text x="58" y="1090.8" fill="#263440" font-size="24" font-weight="400">verursacht Erschütterungen; besonders häufig an</text><text x="58" y="1122" fill="#263440" font-size="24" font-weight="400">Plattengrenzen.</text></g></svg>