<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1473.6000000000001" viewBox="0 0 800 1473.6000000000001" role="img"><title>Grundrechte im Alltag</title><desc>Grundrechte schützen Menschen insbesondere gegenüber dem Staat.</desc><rect width="800" height="1473.6000000000001" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Grundrechte im Alltag</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Grundrechte schützen Menschen insbesondere gegenüber dem Staat.</text><g transform="translate(0 50)"><rect x="35" y="150" width="220" height="85" rx="9" fill="#dfe9f3"/><text x="50" y="185" fill="#263440" font-size="25" font-weight="700">Menschenwürde</text><text x="260" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="290" y="150" width="220" height="85" rx="9" fill="#dcece3"/><text x="305" y="185" fill="#263440" font-size="25" font-weight="700">Gleichheit</text><text x="515" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="545" y="150" width="220" height="85" rx="9" fill="#f3e6d5"/><text x="560" y="185" fill="#263440" font-size="25" font-weight="700">Freiheit</text></g><rect x="40" y="440" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Menschenwürde</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Jeder Mensch hat einen unverlierbaren Wert. Niemand</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">darf zum bloßen Objekt staatlichen Handelns gemacht</text><text x="58" y="578.4" fill="#263440" font-size="24" font-weight="400">werden.</text><text x="58" y="621.6" fill="#196246" font-size="24" font-weight="600">Artikel 1 Grundgesetz</text><rect x="40" y="660.6" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="696.6" fill="#214d7c" font-size="28" font-weight="700">Gleichheit</text><text x="58" y="736.6" fill="#263440" font-size="24" font-weight="400">Vor dem Gesetz sind alle Menschen gleich.</text><text x="58" y="767.8000000000001" fill="#263440" font-size="24" font-weight="400">Benachteiligung etwa wegen Herkunft oder Behinderung</text><text x="58" y="799" fill="#263440" font-size="24" font-weight="400">ist verboten.</text><text x="58" y="842.2" fill="#196246" font-size="24" font-weight="600">Artikel 3 Grundgesetz</text><rect x="40" y="881.2" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="917.2" fill="#214d7c" font-size="28" font-weight="700">Glaubensfreiheit</text><text x="58" y="957.2" fill="#263440" font-size="24" font-weight="400">Jeder Mensch darf einen Glauben haben oder keinen.</text><text x="58" y="1000.4000000000001" fill="#196246" font-size="24" font-weight="600">Artikel 4 Grundgesetz</text><rect x="40" y="1039.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1075.4" fill="#214d7c" font-size="28" font-weight="700">Meinungsfreiheit</text><text x="58" y="1115.4" fill="#263440" font-size="24" font-weight="400">Meinungen dürfen geäußert werden. Es gelten rechtliche</text><text x="58" y="1146.6000000000001" fill="#263440" font-size="24" font-weight="400">Grenzen, etwa zum Schutz der persönlichen Ehre.</text><text x="58" y="1189.8000000000002" fill="#196246" font-size="24" font-weight="600">Artikel 5 Grundgesetz</text><rect x="40" y="1228.8000000000002" width="720" height="204.8" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1264.8000000000002" fill="#214d7c" font-size="28" font-weight="700">Schutz und Rücksicht</text><text x="58" y="1304.8000000000002" fill="#263440" font-size="24" font-weight="400">Viele Grundrechte können zum Schutz anderer Rechte</text><text x="58" y="1336.0000000000002" fill="#263440" font-size="24" font-weight="400">begrenzt werden. Menschenwürde bleibt unantastbar.</text><text x="58" y="1367.2000000000003" fill="#263440" font-size="24" font-weight="400">Gesetzliche Einschränkungen müssen zulässig und</text><text x="58" y="1398.4" fill="#263440" font-size="24" font-weight="400">verhältnismäßig sein.</text></g></svg>