height="16" fill="#dfebe5"/><rect x="130" y="215" width="16" height="16" fill="#dfebe5"/><rect x="148" y="215" width="16" height="16" fill="#dfebe5"/><rect x="166" y="215" width="16" height="16" fill="#dfebe5"/><rect x="184" y="215" width="16" height="16" fill="#dfebe5"/><rect x="202" y="215" width="16" height="16" fill="#dfebe5"/><rect x="40" y="233" width="16" height="16" fill="#dfebe5"/><rect x="58" y="233" width="16" height="16" fill="#dfebe5"/><rect x="76" y="233" width="16" height="16" fill="#dfebe5"/><rect x="94" y="233" width="16" height="16" fill="#dfebe5"/><rect x="112" y="233" width="16" height="16" fill="#dfebe5"/><rect x="130" y="233" width="16" height="16" fill="#dfebe5"/><rect x="148" y="233" width="16" height="16" fill="#dfebe5"/><rect x="166" y="233" width="16" height="16" fill="#dfebe5"/><rect x="184" y="233" width="16" height="16" fill="#dfebe5"/><rect x="202" y="233" width="16" height="16" fill="#dfebe5"/><rect x="40" y="251" width="16" height="16" fill="#dfebe5"/><rect x="58" y="251" width="16" height="16" fill="#dfebe5"/><rect x="76" y="251" width="16" height="16" fill="#dfebe5"/><rect x="94" y="251" width="16" height="16" fill="#dfebe5"/><rect x="112" y="251" width="16" height="16" fill="#dfebe5"/><rect x="130" y="251" width="16" height="16" fill="#dfebe5"/><rect x="148" y="251" width="16" height="16" fill="#dfebe5"/><rect x="166" y="251" width="16" height="16" fill="#dfebe5"/><rect x="184" y="251" width="16" height="16" fill="#dfebe5"/><rect x="202" y="251" width="16" height="16" fill="#dfebe5"/><rect x="40" y="269" width="16" height="16" fill="#dfebe5"/><rect x="58" y="269" width="16" height="16" fill="#dfebe5"/><rect x="76" y="269" width="16" height="16" fill="#dfebe5"/><rect x="94" y="269" width="16" height="16" fill="#dfebe5"/><rect x="112" y="269" width="16" height="16" fill="#dfebe5"/><rect x="130" y="269" width="16" height="16" fill="#dfebe5"/><rect x="148" y="269" width="16" height="16" fill="#dfebe5"/><rect x="166" y="269" width="16" height="16" fill="#dfebe5"/><rect x="184" y="269" width="16" height="16" fill="#dfebe5"/><rect x="202" y="269" width="16" height="16" fill="#dfebe5"/><rect x="40" y="287" width="16" height="16" fill="#dfebe5"/><rect x="58" y="287" width="16" height="16" fill="#dfebe5"/><rect x="76" y="287" width="16" height="16" fill="#dfebe5"/><rect x="94" y="287" width="16" height="16" fill="#dfebe5"/><rect x="112" y="287" width="16" height="16" fill="#dfebe5"/><rect x="130" y="287" width="16" height="16" fill="#dfebe5"/><rect x="148" y="287" width="16" height="16" fill="#dfebe5"/><rect x="166" y="287" width="16" height="16" fill="#dfebe5"/><rect x="184" y="287" width="16" height="16" fill="#dfebe5"/><rect x="202" y="287" width="16" height="16" fill="#dfebe5"/><text x="300" y="190" fill="#196246" font-size="30" font-weight="700">20 von 100 = 20 %</text><text x="300" y="238" fill="#263440" font-size="23" font-weight="400">Ein Prozent ist ein Hundertstel.</text></g><rect x="40" y="440" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Prozentwert W</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Wie viel sind 20 % von 80 €?</text><text x="58" y="559.2" fill="#196246" font-size="24" font-weight="600">W = G·p/100 = 80·20/100 = 16 €</text><rect x="40" y="598.2" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="634.2" fill="#214d7c" font-size="28" font-weight="700">Prozentsatz p %</text><text x="58" y="674.2" fill="#263440" font-size="24" font-weight="400">16 € sind wie viel Prozent von 80 €?</text><text x="58" y="717.4000000000001" fill="#196246" font-size="24" font-weight="600">p = W·100/G = 16·100/80 = 20</text><rect x="40" y="756.4000000000001" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="792.4000000000001" fill="#214d7c" font-size="28" font-weight="700">Grundwert G</text><text x="58" y="832.4000000000001" fill="#263440" font-size="24" font-weight="400">16 € sind 20 %. Wie groß ist das Ganze?</text><text x="58" y="875.6000000000001" fill="#196246" font-size="24" font-weight="600">G = W·100/p = 16·100/20 = 80 €</text><rect x="40" y="914.6000000000001" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="950.6000000000001" fill="#214d7c" font-size="28" font-weight="700">Anschaulich</text><text x="58" y="990.6000000000001" fill="#263440" font-size="24" font-weight="400">100 % ist das Ganze. 50 % ist die Hälfte, 25 % ein</text><text x="58" y="1021.8000000000002" fill="#263440" font-size="24" font-weight="400">Viertel.</text><text x="58" y="1065.0000000000002" fill="#196246" font-size="24" font-weight="600">50 % = 1/2 · 25 % = 1/4 · 10 % = 1/10</text></g></svg>