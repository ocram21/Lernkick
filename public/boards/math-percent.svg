<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1126.0000000000002" viewBox="0 0 800 1126.0000000000002" role="img"><title>Prozentrechnung</title><desc>G ist das Ganze, W ist der Anteil, p ist die Prozentzahl: bei 20 % ist p = 20.</desc><rect width="800" height="1126.0000000000002" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Prozentrechnung</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">G ist das Ganze, W ist der Anteil, p ist die Prozentzahl: bei 20 %</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">ist p = 20.</text><g transform="translate(0 50)"><rect x="40" y="125" width="16" height="16" fill="#27745a"/><rect x="58" y="125" width="16" height="16" fill="#27745a"/><rect x="76" y="125" width="16" height="16" fill="#27745a"/><rect x="94" y="125" width="16" height="16" fill="#27745a"/><rect x="112" y="125" width="16" height="16" fill="#27745a"/><rect x="130" y="125" width="16" height="16" fill="#27745a"/><rect x="148" y="125" width="16" height="16" fill="#27745a"/><rect x="166" y="125" width="16" height="16" fill="#27745a"/><rect x="184" y="125" width="16" height="16" fill="#27745a"/><rect x="202" y="125" width="16" height="16" fill="#27745a"/><rect x="40" y="143" width="16" height="16" fill="#27745a"/><rect x="58" y="143" width="16" height="16" fill="#27745a"/><rect x="76" y="143" width="16" height="16" fill="#27745a"/><rect x="94" y="143" width="16" height="16" fill="#27745a"/><rect x="112" y="143" width="16" height="16" fill="#27745a"/><rect x="130" y="143" width="16" height="16" fill="#27745a"/><rect x="148" y="143" width="16" height="16" fill="#27745a"/><rect x="166" y="143" width="16" height="16" fill="#27745a"/><rect x="184" y="143" width="16" height="16" fill="#27745a"/><rect x="202" y="143" width="16" height="16" fill="#27745a"/><rect x="40" y="161" width="16" height="16" fill="#dfebe5"/><rect x="58" y="161" width="16"