<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1357.6" viewBox="0 0 800 1357.6" role="img"><title>Demokratie und Bundestagswahl</title><desc>Wahlen ermöglichen politische Mitbestimmung. Die Stimmabgabe ist geheim.</desc><rect width="800" height="1357.6" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Demokratie und Bundestagswahl</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Wahlen ermöglichen politische Mitbestimmung. Die Stimmabgabe ist</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">geheim.</text><g transform="translate(0 50)"><text x="65" y="160" fill="#214d7c" font-size="30" font-weight="700">Erststimme</text><text x="65" y="220" fill="#263440" font-size="24" font-weight="400">Person im Wahlkreis</text><text x="430" y="160" fill="#196246" font-size="30" font-weight="700">Zweitstimme</text><text x="430" y="220" fill="#263440" font-size="24" font-weight="400">Landesliste einer Partei</text></g><rect x="40" y="440" width="720" height="111.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Wahlgrundsätze</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Allgemein, unmittelbar, frei, gleich und geheim.</text><rect x="40" y="569.2" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="605.2" fill="#214d7c" font-size="28" font-weight="700">Erststimme</text><text x="58" y="645.2" fill="#263440" font-size="24" font-weight="400">Mit ihr wird eine Person im Wahlkreis gewählt. Für</text><text x="58" y="676.4000000000001" fill="#263440" font-size="24" font-weight="400">einen Sitz eines Parteibewerbers braucht es neben den</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">meisten Erststimmen auch Zweitstimmendeckung.</text><rect x="40" y="760.8000000000001" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="796.8000000000001" fill="#214d7c" font-size="28" font-weight="700">Zweitstimme</text><text x="58" y="836.8000000000001" fill="#263440" font-size="24" font-weight="400">Mit ihr wird die Landesliste einer Partei gewählt. Sie</text><text x="58" y="868.0000000000001" fill="#263440" font-size="24" font-weight="400">ist maßgeblich für die Verteilung der Sitze auf die</text><text x="58" y="899.2" fill="#263440" font-size="24" font-weight="400">Parteien.</text><rect x="40" y="952.4000000000001" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="988.4000000000001" fill="#214d7c" font-size="28" font-weight="700">Ablauf</text><text x="58" y="1028.4" fill="#263440" font-size="24" font-weight="400">Wahlberechtigung prüfen → informieren → Stimmzettel</text><text x="58" y="1059.6000000000001" fill="#263440" font-size="24" font-weight="400">ausfüllen → geheim abgeben. Briefwahl ist nach Antrag</text><text x="58" y="1090.8000000000002" fill="#263440" font-size="24" font-weight="400">möglich.</text><rect x="40" y="1144" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1180" fill="#214d7c" font-size="28" font-weight="700">Mitbestimmen</text><text x="58" y="1220" fill="#263440" font-size="24" font-weight="400">Auch zwischen Wahlen sind Beteiligung und sachliche</text><text x="58" y="1251.2" fill="#263440" font-size="24" font-weight="400">Diskussion möglich, zum Beispiel durch Petitionen oder</text><text x="58" y="1282.4" fill="#263440" font-size="24" font-weight="400">Mitarbeit in Vereinen und Parteien.</text></g></svg>