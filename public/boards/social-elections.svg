<svg xmlns="http://www.w3.org/2000/svg" width="800" height="820" viewBox="0 0 800 820" role="img"><title>Bundestagswahl: zwei Stimmen</title><desc>Beschriftetes Lernschema. Größen vereinfacht.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="820" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="35" y="50" font-size="30" fill="#203d49" text-anchor="start" font-weight="700">Bundestagswahl: zwei Stimmen</text><text x="35" y="105" font-size="24" fill="#203d49" text-anchor="start" font-weight="400">Eine Wahlentscheidung – zwei unterschiedliche Stimmen.</text><rect x="35" y="150" width="340" height="280" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="55" y="190" font-size="28" fill="#203d49" text-anchor="start" font-weight="700">Erststimme</text><circle cx="90" cy="245" r="20" fill="none" stroke="#32627c" stroke-width="3"/><path d="M79 234L101 256M101 234L79 256" stroke="#32627c" stroke-width="3" fill="none"/><text x="55" y="315" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Person im Wahlkreis</text><text x="55" y="360" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">Wer soll den Wahlkreis vertreten?</text><rect x="425" y="150" width="340" height="280" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="445" y="190" font-size="28" fill="#203d49" text-anchor="start" font-weight="700">Zweitstimme</text><circle cx="480" cy="245" r="20" fill="none" stroke="#32627c" stroke-width="3"/><path d="M469 234L491 256M491 234L469 256" stroke="#32627c" stroke-width="3" fill="none"/><text x="445" y="315" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Landesliste einer Partei</text><text x="445" y="360" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">Bestimmt die Sitzverteilung maßgeblich.</text><text x="35" y="480" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Parteisitz im Wahlkreis: meiste Erststimmen allein reichen</text><text x="35" y="516" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">nicht; zusätzlich ist Zweitstimmendeckung erforderlich.</text><path d="M180 550V600H400" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 550V600H405" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="215" y="625" width="370" height="80" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="400" y="673" font-size="29" fill="#203d49" text-anchor="middle" font-weight="700">Bundestag</text><text x="35" y="755" font-size="24" fill="#203d49" text-anchor="start" font-weight="400">Allgemein · unmittelbar · frei · gleich · geheim</text><text x="35" y="798" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">LernKick · eigenes, vereinfachtes Lernschema</text></g></svg>