<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1157.2" viewBox="0 0 800 1157.2" role="img"><title>Brüche verstehen und rechnen</title><desc>Zähler oben: wie viele Teile? Nenner unten: in wie viele gleich große Teile ist ein Ganzes geteilt?</desc><rect width="800" height="1157.2" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Brüche verstehen und rechnen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Zähler oben: wie viele Teile? Nenner unten: in wie viele gleich</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">große Teile ist ein Ganzes geteilt?</text><g transform="translate(0 50)"><circle cx="160" cy="205" r="80" fill="#d6e8e4" stroke="#27745a" stroke-width="3"/><path d="M160 125A80 80 0 0 1 240 205H160Z" fill="#27745a"/><path d="M80 205L240 205" fill="none" stroke="#fff" stroke-width="3"/><path d="M160 125L160 285" fill="none" stroke="#fff" stroke-width="3"/><text x="300" y="190" fill="#263440" font-size="28" font-weight="400">1 von 4 Teilen = 1/4</text><text x="300" y="238" fill="#263440" font-size="23" font-weight="400">Vier gleich große Viertel bilden</text><text x="300" y="267.9" fill="#263440" font-size="23" font-weight="400">ein Ganzes.</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Erweitern und kürzen</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Zähler und Nenner mit derselben Zahl multiplizieren</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">oder durch dieselbe Zahl teilen.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">1/2 = 3/6 · 6/8 = 3/4</text><rect x="40" y="629.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Addieren und subtrahieren</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">Zuerst einen gemeinsamen Nenner bilden. Dann nur die</text><text x="58" y="736.6" fill="#263440" font-size="24" font-weight="400">Zähler verrechnen.</text><text x="58" y="779.8" fill="#196246" font-size="24" font-weight="600">1/2+1/4 = 3/4 · 3/4−1/4 = 1/2</text><rect x="40" y="818.8" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="854.8" fill="#214d7c" font-size="28" font-weight="700">Multiplizieren</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">Zähler mal Zähler, Nenner mal Nenner; danach kürzen.</text><text x="58" y="938" fill="#196246" font-size="24" font-weight="600">2/3 · 3/4 = 6/12 = 1/2</text><rect x="40" y="977" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1013" fill="#214d7c" font-size="28" font-weight="700">Dividieren</text><text x="58" y="1053" fill="#263440" font-size="24" font-weight="400">Mit dem Kehrwert des zweiten Bruchs multiplizieren.</text><text x="58" y="1096.2" fill="#196246" font-size="24" font-weight="600">1/2 : 3/4 = 1/2 · 4/3 = 2/3</text></g></svg>