<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1473.6000000000004" viewBox="0 0 800 1473.6000000000004" role="img"><title>Die Zeitformen</title><desc>Ein Beispielverb in sechs Zeitformen.</desc><rect width="800" height="1473.6000000000004" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Die Zeitformen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Ein Beispielverb in sechs Zeitformen.</text><g transform="translate(0 50)"><path d="M80 200L720 200" fill="none" stroke="#32627c" stroke-width="3"/><path d="M720 200L700 190V210Z" fill="#32627c"/><circle cx="140" cy="200" r="9" fill="#27745a"/><text x="60" y="250" fill="#263440" font-size="23" font-weight="400">Vergangenheit</text><circle cx="400" cy="200" r="9" fill="#27745a"/><text x="320" y="250" fill="#263440" font-size="23" font-weight="400">Gegenwart</text><circle cx="650" cy="200" r="9" fill="#27745a"/><text x="570" y="250" fill="#263440" font-size="23" font-weight="400">Zukunft</text></g><rect x="40" y="440" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Präsens</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Gegenwart; kann mit Zeitangabe auch Zukunft ausdrücken.</text><text x="58" y="559.2" fill="#196246" font-size="24" font-weight="600">Ich lerne. · Morgen lerne ich.</text><rect x="40" y="598.2" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="634.2" fill="#214d7c" font-size="28" font-weight="700">Präteritum</text><text x="58" y="674.2" fill="#263440" font-size="24" font-weight="400">Vergangenheit; häufig beim Erzählen oder in Berichten.</text><text x="58" y="717.4000000000001" fill="#196246" font-size="24" font-weight="600">Ich lernte.</text><rect x="40" y="756.4000000000001" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="792.4000000000001" fill="#214d7c" font-size="28" font-weight="700">Perfekt</text><text x="58" y="832.4000000000001" fill="#263440" font-size="24" font-weight="400">Vergangenheit mit haben oder sein und einem Partizip.</text><text x="58" y="875.6000000000001" fill="#196246" font-size="24" font-weight="600">Ich habe gelernt.</text><rect x="40" y="914.6000000000001" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="950.6000000000001" fill="#214d7c" font-size="28" font-weight="700">Plusquamperfekt</text><text x="58" y="990.6000000000001" fill="#263440" font-size="24" font-weight="400">Etwas geschah vor einem anderen Ereignis in der</text><text x="58" y="1021.8000000000002" fill="#263440" font-size="24" font-weight="400">Vergangenheit.</text><text x="58" y="1065.0000000000002" fill="#196246" font-size="24" font-weight="600">Ich hatte gelernt, bevor der Test begann.</text><rect x="40" y="1104.0000000000002" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1140.0000000000002" fill="#214d7c" font-size="28" font-weight="700">Futur I</text><text x="58" y="1180.0000000000002" fill="#263440" font-size="24" font-weight="400">Mit werden und Infinitiv; oft Zukunft oder Vermutung.</text><text x="58" y="1223.2000000000003" fill="#196246" font-size="24" font-weight="600">Ich werde lernen.</text><rect x="40" y="1262.2000000000003" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1298.2000000000003" fill="#214d7c" font-size="28" font-weight="700">Futur II</text><text x="58" y="1338.2000000000003" fill="#263440" font-size="24" font-weight="400">Etwas wird zu einem späteren Zeitpunkt abgeschlossen</text><text x="58" y="1369.4000000000003" fill="#263440" font-size="24" font-weight="400">sein; auch für Vermutungen.</text><text x="58" y="1412.6000000000004" fill="#196246" font-size="24" font-weight="600">Bis morgen werde ich gelernt haben.</text></g></svg>