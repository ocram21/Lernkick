<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1092.6" viewBox="0 0 800 1092.6" role="img"><title>Direkter und indirekter Dreisatz</title><desc>Erst auf eine Einheit, dann auf die gesuchte Menge rechnen.</desc><rect width="800" height="1092.6" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Direkter und indirekter Dreisatz</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Erst auf eine Einheit, dann auf die gesuchte Menge rechnen.</text><g transform="translate(0 50)"><g><text x="70" y="155" fill="#196246" font-size="28" font-weight="700">Direkt</text><text x="70" y="205" fill="#263440" font-size="23" font-weight="400">mehr Menge → mehr Preis</text><text x="420" y="155" fill="#214d7c" font-size="28" font-weight="700">Indirekt</text><text x="420" y="205" fill="#263440" font-size="23" font-weight="400">mehr Personen → weniger</text><text x="420" y="234.9" fill="#263440" font-size="23" font-weight="400">Zeit</text></g></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Direkt: mehr Hefte kosten mehr</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">3 Hefte kosten 6 €. Ein Heft kostet 2 €. Fünf Hefte</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">kosten 10 €.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">3 → 6 € | 1 → 2 € | 5 → 10 €</text><rect x="40" y="629.4" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Indirekt: mehr Personen brauchen weniger Zeit</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">2 Personen brauchen 6 Stunden. Bei gleicher Leistung</text><text x="58" y="736.6" fill="#263440" font-size="24" font-weight="400">braucht 1 Person 12 Stunden; 3 Personen brauchen 4</text><text x="58" y="767.8" fill="#263440" font-size="24" font-weight="400">Stunden.</text><text x="58" y="811" fill="#196246" font-size="24" font-weight="600">2 → 6 h | 1 → 12 h | 3 → 4 h</text><rect x="40" y="850" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="886" fill="#214d7c" font-size="28" font-weight="700">Zuerst die Beziehung prüfen</text><text x="58" y="926" fill="#263440" font-size="24" font-weight="400">Bleibt der Preis je Stück gleich? Oder bleibt die</text><text x="58" y="957.2" fill="#263440" font-size="24" font-weight="400">gesamte Arbeit gleich? Indirekter Dreisatz gilt nur bei</text><text x="58" y="988.4" fill="#263440" font-size="24" font-weight="400">gleicher Leistung und gleicher Arbeit.</text><text x="58" y="1031.6" fill="#196246" font-size="24" font-weight="600">Direkt: y/x gleich · Indirekt: x·y gleich</text></g></svg>