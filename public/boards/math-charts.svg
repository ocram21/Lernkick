<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1219.6" viewBox="0 0 800 1219.6" role="img"><title>Diagramme lesen</title><desc>Beispieldaten: A = 10, B = 20, C = 10. Zusammen sind es 40.</desc><rect width="800" height="1219.6" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Diagramme lesen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Beispieldaten: A = 10, B = 20, C = 10. Zusammen sind es 40.</text><g transform="translate(0 50)"><path d="M75 110L75 300" fill="none" stroke="#32627c" stroke-width="3"/><path d="M75 300L380 300" fill="none" stroke="#32627c" stroke-width="3"/><text x="35" y="100" fill="#263440" font-size="20" font-weight="400">Anzahl</text><rect x="110" y="220" width="50" height="80" fill="#32627c"/><text x="125" y="330" fill="#263440" font-size="22" font-weight="400">A</text><text x="115" y="210" fill="#263440" font-size="20" font-weight="400">10</text><rect x="210" y="140" width="50" height="160" fill="#27745a"/><text x="225" y="330" fill="#263440" font-size="22" font-weight="400">B</text><text x="215" y="130" fill="#263440" font-size="20" font-weight="400">20</text><rect x="310" y="220" width="50" height="80" fill="#32627c"/><text x="325" y="330" fill="#263440" font-size="22" font-weight="400">C</text><text x="315" y="210" fill="#263440" font-size="20" font-weight="400">10</text><circle cx="590" cy="215" r="90" fill="#32627c"/><path d="M590 125A90 90 0 0 1 590 305V215Z" fill="#27745a"/><path d="M590 215V305A90 90 0 0 1 500 215Z" fill="#e3b26c"/><text x="550" y="345" fill="#263440" font-size="22" font-weight="400">B: 50 %</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Balken- und Säulendiagramm</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Achsen, Einheiten und Skala lesen. Vergleiche die</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Balkenlängen oder Säulenhöhen.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">A: 10 · B: 20 · C: 10</text><rect x="40" y="629.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Kreisdiagramm</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">Ein Kreis zeigt das Ganze. B ist die Hälfte, A und C</text><text x="58" y="736.6" fill="#263440" font-size="24" font-weight="400">sind je ein Viertel.</text><text x="58" y="779.8" fill="#196246" font-size="24" font-weight="600">B: 50 % = 180° · A und C: je 25 % = 90°</text><rect x="40" y="818.8" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="854.8" fill="#214d7c" font-size="28" font-weight="700">Beim Auswerten</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">Was wird dargestellt? Welcher Wert ist am größten? Wie</text><text x="58" y="926" fill="#263440" font-size="24" font-weight="400">groß ist der Unterschied?</text><text x="58" y="969.1999999999999" fill="#196246" font-size="24" font-weight="600">20−10 = 10</text><rect x="40" y="1008.1999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1044.1999999999998" fill="#214d7c" font-size="28" font-weight="700">Vorsicht bei Skalen</text><text x="58" y="1084.1999999999998" fill="#263440" font-size="24" font-weight="400">Eine Achse kann abgeschnitten sein. Gleiche Abstände</text><text x="58" y="1115.3999999999999" fill="#263440" font-size="24" font-weight="400">müssen gleiche Wertschritte zeigen.</text><text x="58" y="1158.6" fill="#196246" font-size="24" font-weight="600">Überschrift → Achsen → Werte → Aussage</text></g></svg>