<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1406.8" viewBox="0 0 800 1406.8" role="img"><title>Texte und Aufgaben verstehen</title><desc>Langsam und gezielt lesen. Du musst nicht alles auf einmal behalten.</desc><rect width="800" height="1406.8" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Texte und Aufgaben verstehen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Langsam und gezielt lesen. Du musst nicht alles auf einmal</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">behalten.</text><g transform="translate(0 50)"><rect x="35" y="150" width="220" height="85" rx="9" fill="#dfe9f3"/><text x="50" y="185" fill="#263440" font-size="25" font-weight="700">Auftrag lesen</text><text x="260" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="290" y="150" width="220" height="85" rx="9" fill="#dcece3"/><text x="305" y="185" fill="#263440" font-size="25" font-weight="700">Textstelle</text><text x="305" y="217.5" fill="#263440" font-size="25" font-weight="700">finden</text><text x="515" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="545" y="150" width="220" height="85" rx="9" fill="#f3e6d5"/><text x="560" y="185" fill="#263440" font-size="25" font-weight="700">Antwort prüfen</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Auftrag lesen</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Markiere, was du tun sollst. Achte auf nennt,</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">beschreibt, erklärt oder begründet.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">Nenne: kurz aufzählen · Begründe: einen Grund angeben</text><rect x="40" y="629.4" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Überblick gewinnen</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">Überschrift und Absätze ansehen. Worum geht es?</text><text x="58" y="748.6" fill="#196246" font-size="24" font-weight="600">Wer? Was? Wann? Wo?</text><rect x="40" y="787.5999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="823.5999999999999" fill="#214d7c" font-size="28" font-weight="700">Informationen finden</text><text x="58" y="863.5999999999999" fill="#263440" font-size="24" font-weight="400">Suche Schlüsselwörter. Markiere die passende Textstelle</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">statt alles zu markieren.</text><text x="58" y="937.9999999999999" fill="#196246" font-size="24" font-weight="600">Eine Behauptung mit der Textstelle prüfen.</text><rect x="40" y="976.9999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1012.9999999999999" fill="#214d7c" font-size="28" font-weight="700">In eigenen Worten antworten</text><text x="58" y="1053" fill="#263440" font-size="24" font-weight="400">Beantworte genau die Frage. Bei einem Zitat</text><text x="58" y="1084.2" fill="#263440" font-size="24" font-weight="400">Anführungszeichen und Fundstelle verwenden.</text><text x="58" y="1127.4" fill="#196246" font-size="24" font-weight="600">Aussage → Beleg → kurze Erklärung</text><rect x="40" y="1166.3999999999999" width="720" height="200.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1202.3999999999999" fill="#214d7c" font-size="28" font-weight="700">Kontrollieren</text><text x="58" y="1242.3999999999999" fill="#263440" font-size="24" font-weight="400">Passt die Antwort zum Auftrag? Ist sie vollständig und</text><text x="58" y="1273.6" fill="#263440" font-size="24" font-weight="400">verständlich?</text><text x="58" y="1316.8" fill="#196246" font-size="24" font-weight="600">Unbekannte Wörter aus dem Zusammenhang erschließen</text><text x="58" y="1348" fill="#196246" font-size="24" font-weight="600">oder nachschlagen.</text></g></svg>