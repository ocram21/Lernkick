<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1326.4" viewBox="0 0 800 1326.4" role="img"><title>Tag, Nacht und Jahreszeiten</title><desc>Drehung und Umlauf der Erde sind unterschiedliche Bewegungen.</desc><rect width="800" height="1326.4" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Tag, Nacht und Jahreszeiten</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Drehung und Umlauf der Erde sind unterschiedliche Bewegungen.</text><g transform="translate(0 50)"><circle cx="160" cy="215" r="65" fill="#f6d46a"/><circle cx="480" cy="215" r="55" fill="#8cb7d8"/><path d="M480 160A55 55 0 0 1 480 270Z" fill="#263440"/><path d="M455 145L505 285" fill="none" stroke="#27745a" stroke-width="4"/><text x="110" y="315" fill="#263440" font-size="24" font-weight="400">Sonne</text><text x="410" y="315" fill="#263440" font-size="24" font-weight="400">Tag / Nacht</text><text x="340" y="120" fill="#263440" font-size="21" font-weight="400">Achse: etwa 23,5° geneigt</text><text x="340" y="350" fill="#263440" font-size="21" font-weight="400">Drehung: etwa 24 Stunden</text></g><rect x="40" y="440" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Tag und Nacht</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Die Erde dreht sich in ungefähr 24 Stunden einmal um</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">ihre Achse. Die der Sonne zugewandte Seite ist</text><text x="58" y="578.4" fill="#263440" font-size="24" font-weight="400">beleuchtet.</text><rect x="40" y="631.6" width="720" height="111.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="667.6" fill="#214d7c" font-size="28" font-weight="700">Ein Jahr</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">Die Erde läuft in ungefähr 365¼ Tagen um die Sonne.</text><rect x="40" y="760.8" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="796.8" fill="#214d7c" font-size="28" font-weight="700">Jahreszeiten</text><text x="58" y="836.8" fill="#263440" font-size="24" font-weight="400">Die Erdachse ist um etwa 23,5° gegen die Senkrechte auf</text><text x="58" y="868" fill="#263440" font-size="24" font-weight="400">der Bahnebene geneigt. Dadurch ändern sich Sonnenhöhe</text><text x="58" y="899.1999999999999" fill="#263440" font-size="24" font-weight="400">und Tageslänge.</text><rect x="40" y="952.4" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="988.4" fill="#214d7c" font-size="28" font-weight="700">Nord und Süd</text><text x="58" y="1028.4" fill="#263440" font-size="24" font-weight="400">Wenn auf der Nordhalbkugel Sommer ist, ist auf der</text><text x="58" y="1059.6000000000001" fill="#263440" font-size="24" font-weight="400">Südhalbkugel Winter – und umgekehrt.</text><rect x="40" y="1112.8" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1148.8" fill="#214d7c" font-size="28" font-weight="700">Kein Entfernungs-Trick</text><text x="58" y="1188.8" fill="#263440" font-size="24" font-weight="400">Die Jahreszeiten entstehen vor allem durch die</text><text x="58" y="1220" fill="#263440" font-size="24" font-weight="400">Achsneigung, nicht durch wechselnde Entfernung zur</text><text x="58" y="1251.2" fill="#263440" font-size="24" font-weight="400">Sonne.</text></g></svg>