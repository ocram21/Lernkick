<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1197.2" viewBox="0 0 800 1197.2" role="img"><title>Klimazonen und Wasserkreislauf</title><desc>Klima beschreibt Wetter über lange Zeiträume. Wasser wechselt Ort und Zustand.</desc><rect width="800" height="1197.2" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Klimazonen und Wasserkreislauf</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Klima beschreibt Wetter über lange Zeiträume. Wasser wechselt Ort</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">und Zustand.</text><g transform="translate(0 50)"><rect x="50" y="120" width="250" height="36" fill="#d7edf6"/><text x="65" y="145" fill="#263440" font-size="20" font-weight="400">Polar</text><rect x="50" y="156" width="250" height="36" fill="#8ec6dc"/><text x="65" y="181" fill="#263440" font-size="20" font-weight="400">Subpolar</text><rect x="50" y="192" width="250" height="36" fill="#91ba82"/><text x="65" y="217" fill="#263440" font-size="20" font-weight="400">Gemäßigt</text><rect x="50" y="228" width="250" height="36" fill="#edc681"/><text x="65" y="253" fill="#263440" font-size="20" font-weight="400">Subtropen</text><rect x="50" y="264" width="250" height="36" fill="#dc9a6d"/><text x="65" y="289" fill="#263440" font-size="20" font-weight="400">Tropen</text><text x="70" y="335" fill="#263440" font-size="20" font-weight="400">Pol → Äquator</text><text x="355" y="150" fill="#263440" font-size="24" font-weight="400">Verdunstung → Wolken</text><text x="450" y="210" fill="#263440" font-size="24" font-weight="400">↓ Niederschlag</text><text x="355" y="275" fill="#263440" font-size="23" font-weight="400">Meer ← Fluss / Grundwasser</text></g><rect x="40" y="440" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Klimazonen – vereinfachtes Modell</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Vom Äquator zu den Polen: Tropen, Subtropen, gemäßigte</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Zone, subpolare und polare Zone. Höhe, Meeresnähe und</text><text x="58" y="578.4" fill="#263440" font-size="24" font-weight="400">Strömungen verändern das Klima zusätzlich.</text><rect x="40" y="631.6" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="667.6" fill="#214d7c" font-size="28" font-weight="700">Verdunstung und Kondensation</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">Sonnenenergie lässt Wasser verdunsten. Beim Abkühlen</text><text x="58" y="738.8000000000001" fill="#263440" font-size="24" font-weight="400">kann Wasserdampf zu kleinen Tröpfchen kondensieren;</text><text x="58" y="770" fill="#263440" font-size="24" font-weight="400">Wolken entstehen.</text><rect x="40" y="823.2" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="859.2" fill="#214d7c" font-size="28" font-weight="700">Niederschlag und Rückfluss</text><text x="58" y="899.2" fill="#263440" font-size="24" font-weight="400">Wasser fällt etwa als Regen oder Schnee. Es versickert,</text><text x="58" y="930.4000000000001" fill="#263440" font-size="24" font-weight="400">fließt im Boden oder über Bäche und Flüsse zurück.</text><rect x="40" y="983.6" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1019.6" fill="#214d7c" font-size="28" font-weight="700">Speicher</text><text x="58" y="1059.6" fill="#263440" font-size="24" font-weight="400">Wasser wird unter anderem in Ozeanen, Seen, Boden,</text><text x="58" y="1090.8" fill="#263440" font-size="24" font-weight="400">Grundwasser und Eis gespeichert. Pflanzen geben</text><text x="58" y="1122" fill="#263440" font-size="24" font-weight="400">ebenfalls Wasserdampf ab.</text></g></svg>