<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1056.6" viewBox="0 0 800 1056.6" role="img"><title>Maßeinheiten umrechnen</title><desc>Achte darauf, ob du Längen, Flächen oder Volumen umrechnest.</desc><rect width="800" height="1056.6" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Maßeinheiten umrechnen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Achte darauf, ob du Längen, Flächen oder Volumen umrechnest.</text><rect x="40" y="150" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="186" fill="#214d7c" font-size="28" font-weight="700">Länge</text><text x="58" y="226" fill="#263440" font-size="24" font-weight="400">Von km zu m: mal 1000. Von m zu dm, dm zu cm und cm zu</text><text x="58" y="257.2" fill="#263440" font-size="24" font-weight="400">mm jeweils mal 10. Zurück teilst du durch denselben</text><text x="58" y="288.4" fill="#263440" font-size="24" font-weight="400">Faktor.</text><text x="58" y="331.6" fill="#196246" font-size="24" font-weight="600">1 km = 1000 m · 1 m = 10 dm = 100 cm = 1000 mm</text><rect x="40" y="370.6" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="406.6" fill="#214d7c" font-size="28" font-weight="700">Fläche</text><text x="58" y="446.6" fill="#263440" font-size="24" font-weight="400">Je benachbarter Stufe mal 100.</text><text x="58" y="489.8" fill="#196246" font-size="24" font-weight="600">1 m² = 100 dm² = 10 000 cm²</text><rect x="40" y="528.8" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="564.8" fill="#214d7c" font-size="28" font-weight="700">Volumen und Liter</text><text x="58" y="604.8" fill="#263440" font-size="24" font-weight="400">Je benachbarter Kubik-Stufe mal 1000.</text><text x="58" y="648" fill="#196246" font-size="24" font-weight="600">1 m³ = 1000 dm³ · 1 l = 1 dm³ · 1 ml = 1 cm³</text><rect x="40" y="687" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="723" fill="#214d7c" font-size="28" font-weight="700">Masse</text><text x="58" y="763" fill="#263440" font-size="24" font-weight="400">Von Tonnen zu Kilogramm und von Kilogramm zu Gramm</text><text x="58" y="794.2" fill="#263440" font-size="24" font-weight="400">jeweils mal 1000.</text><text x="58" y="837.4" fill="#196246" font-size="24" font-weight="600">1 t = 1000 kg · 1 kg = 1000 g · 1 g = 1000 mg</text><rect x="40" y="876.4" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="912.4" fill="#214d7c" font-size="28" font-weight="700">Zeit</text><text x="58" y="952.4" fill="#263440" font-size="24" font-weight="400">Hier gilt nicht immer mal 10.</text><text x="58" y="995.6" fill="#196246" font-size="24" font-weight="600">1 min = 60 s · 1 h = 60 min · 1 Tag = 24 h</text></g></svg>