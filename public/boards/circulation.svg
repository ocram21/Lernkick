<svg xmlns="http://www.w3.org/2000/svg" width="800" height="880" viewBox="0 0 800 880" role="img"><title>Herz: Lungen- und Körperkreislauf</title><desc>Beschriftetes Lernschema. Größen vereinfacht.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="880" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="35" y="50" font-size="30" fill="#203d49" text-anchor="start" font-weight="700">Herz: Lungen- und Körperkreislauf</text><text x="35" y="100" font-size="21" fill="#203d49" text-anchor="start" font-weight="400">Pfeile zeigen den Blutfluss. Rechts/links aus Körpersicht.</text><rect x="235" y="135" width="330" height="80" rx="8" fill="#e2e9df" stroke="#718c87"/><text x="400" y="180" font-size="22" fill="#203d49" text-anchor="middle" font-weight="700">Lunge: Sauerstoff aufnehmen</text><rect x="80" y="300" width="285" height="75" rx="8" fill="#dae8f1" stroke="#718c87"/><text x="222" y="344" font-size="24" fill="#203d49" text-anchor="middle" font-weight="700">Rechter Vorhof</text><rect x="80" y="420" width="285" height="75" rx="8" fill="#dae8f1" stroke="#718c87"/><text x="222" y="465" font-size="22" fill="#203d49" text-anchor="middle" font-weight="700">Rechte Herzkammer</text><path d="M222 375V415" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="435" y="300" width="285" height="75" rx="8" fill="#f0ddd7" stroke="#718c87"/><text x="577" y="344" font-size="24" fill="#203d49" text-anchor="middle" font-weight="700">Linker Vorhof</text><rect x="435" y="420" width="285" height="75" rx="8" fill="#f0ddd7" stroke="#718c87"/><text x="577" y="465" font-size="22" fill="#203d49" text-anchor="middle" font-weight="700">Linke Herzkammer</text><path d="M577 375V415" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M220 495V535H40V175H230" stroke="#32627c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="55" y="245" font-size="21" fill="#32627c" text-anchor="start" font-weight="400">Lungenarterie</text><path d="M565 175H720V265H577V295" stroke="#9f4e3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="560" y="244" font-size="21" fill="#9f4e3d" text-anchor="start" font-weight="400">Lungenvenen</text><rect x="235" y="600" width="330" height="80" rx="8" fill="#e2e9df" stroke="#718c87"/><text x="400" y="645" font-size="22" fill="#203d49" text-anchor="middle" font-weight="700">Körper: Sauerstoff abgeben</text><path d="M577 495V555H660V640H570" stroke="#9f4e3d" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="670" y="564" font-size="21" fill="#9f4e3d" text-anchor="start" font-weight="400">Aorta</text><path d="M235 640H180V560H390V280H222V295" stroke="#32627c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="235" y="550" font-size="21" fill="#32627c" text-anchor="start" font-weight="400">Hohlvenen</text><text x="35" y="735" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Blau: sauerstoffarm · Rot: sauerstoffreich</text><text x="35" y="775" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Arterien führen vom Herzen weg; Venen zum Herzen hin.</text><text x="35" y="815" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Herzklappen lassen das Blut in eine Richtung fließen.</text><text x="35" y="858" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">LernKick · eigenes, vereinfachtes Lernschema</text></g></svg>