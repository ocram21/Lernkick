<svg xmlns="http://www.w3.org/2000/svg" width="800" height="915" viewBox="0 0 800 915" role="img"><title>Bundestag und Bundesrat</title><desc>Beschriftetes Lernschema. Größen vereinfacht.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="915" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="35" y="50" font-size="30" fill="#203d49" text-anchor="start" font-weight="700">Bundestag und Bundesrat</text><text x="35" y="100" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Zwei verschiedene Vertretungen wirken an Bundesgesetzen mit.</text><rect x="35" y="135" width="345" height="390" rx="8" fill="#e4ece7" stroke="#718c87"/><text x="55" y="175" font-size="29" fill="#203d49" text-anchor="start" font-weight="700">Bundestag</text><rect x="130.0" y="295.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="135.3" y="268.2" width="14" height="10" rx="2" fill="#536f75"/><rect x="150.5" y="245.5" width="14" height="10" rx="2" fill="#536f75"/><rect x="173.2" y="230.3" width="14" height="10" rx="2" fill="#536f75"/><rect x="200.0" y="225.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="226.8" y="230.3" width="14" height="10" rx="2" fill="#536f75"/><rect x="249.5" y="245.5" width="14" height="10" rx="2" fill="#536f75"/><rect x="264.7" y="268.2" width="14" height="10" rx="2" fill="#536f75"/><rect x="270.0" y="295.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="105.0" y="295.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="112.2" y="258.6" width="14" height="10" rx="2" fill="#536f75"/><rect x="132.8" y="227.8" width="14" height="10" rx="2" fill="#536f75"/><rect x="163.6" y="207.2" width="14" height="10" rx="2" fill="#536f75"/><rect x="200.0" y="200.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="236.4" y="207.2" width="14" height="10" rx="2" fill="#