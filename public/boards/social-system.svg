517.8" y="227.8" width="14" height="10" rx="2" fill="#536f75"/><rect x="548.6" y="207.2" width="14" height="10" rx="2" fill="#536f75"/><rect x="585.0" y="200.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="621.4" y="207.2" width="14" height="10" rx="2" fill="#536f75"/><rect x="652.2" y="227.8" width="14" height="10" rx="2" fill="#536f75"/><rect x="672.8" y="258.6" width="14" height="10" rx="2" fill="#536f75"/><rect x="680.0" y="295.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="465.0" y="295.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="474.1" y="249.1" width="14" height="10" rx="2" fill="#536f75"/><rect x="500.1" y="210.1" width="14" height="10" rx="2" fill="#536f75"/><rect x="539.1" y="184.1" width="14" height="10" rx="2" fill="#536f75"/><rect x="585.0" y="175.0" width="14" height="10" rx="2" fill="#536f75"/><rect x="630.9" y="184.1" width="14" height="10" rx="2" fill="#536f75"/><rect x="669.9" y="210.1" width="14" height="10" rx="2" fill="#536f75"/><rect x="695.9" y="249.1" width="14" height="10" rx="2" fill="#536f75"/><rect x="705.0" y="295.0" width="14" height="10" rx="2" fill="#536f75"/><text x="435" y="330" font-size="16" fill="#203d49" text-anchor="start" font-weight="400">Sitzordnung im Plenarsaal (schematisch)</text><text x="55" y="370" font-size="19" fill="#203d49" text-anchor="start" font-weight="700">Abgeordnete des Volkes</text><text x="55" y="401" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Wird von Wahlberechtigten gewählt.</text><text x="55" y="432" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Beschließt Gesetze und Haushalt.</text><text x="55" y="463" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Wählt den Bundeskanzler.</text><text x="55" y="494" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Kontrolliert die Bundesregierung.</text><text x="440" y="370" font-size="19" fill="#203d49" text-anchor="start" font-weight="700">Mitglieder der Landesregierungen</text><text x="440" y="401" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Vertreten die 16 Bundesländer.</text><text x="440" y="432" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Beraten Bundesgesetze mit.</text><text x="440" y="463" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">Je nach Gesetz: Zustimmung</text><text x="440" y="494" font-size="19" fill="#203d49" text-anchor="start" font-weight="400">oder Möglichkeit zum Einspruch.</text><path d="M205 530V575H370" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M590 530V575H430" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="255" y="590" width="290" height="65" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="400" y="630" font-size="22" fill="#203d49" text-anchor="middle" font-weight="700">Gesetzgebung des Bundes</text><rect x="65" y="705" width="670" height="100" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="85" y="739" font-size="25" fill="#203d49" text-anchor="start" font-weight="700">Bundesregierung</text><text x="85" y="778" font-size="21" fill="#203d49" text-anchor="start" font-weight="400">Leitet die Politik; Regierung und Verwaltung setzen Gesetze um.</text><path d="M400 660V700" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="855" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Kontrolle durch den Bundestag</text><text x="35" y="893" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">LernKick · eigenes, vereinfachtes Lernschema</text></g></svg>