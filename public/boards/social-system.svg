<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1326.4" viewBox="0 0 800 1326.4" role="img"><title>Das politische System Deutschlands</title><desc>Wichtige Einrichtungen auf Bundesebene und ihre Aufgaben.</desc><rect width="800" height="1326.4" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Das politische System Deutschlands</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Wichtige Einrichtungen auf Bundesebene und ihre Aufgaben.</text><g transform="translate(0 50)"><rect x="35" y="150" width="220" height="85" rx="9" fill="#dfe9f3"/><text x="50" y="185" fill="#263440" font-size="25" font-weight="700">Wahlberechtigte</text><text x="260" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="290" y="150" width="220" height="85" rx="9" fill="#dcece3"/><text x="305" y="185" fill="#263440" font-size="25" font-weight="700">Bundestag</text><text x="515" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="545" y="150" width="220" height="85" rx="9" fill="#f3e6d5"/><text x="560" y="185" fill="#263440" font-size="25" font-weight="700">Bundesregierung</text></g><rect x="40" y="440" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Bundestag</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Wird gewählt. Beschließt Gesetze, entscheidet über den</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Bundeshaushalt, wählt den Bundeskanzler und</text><text x="58" y="578.4" fill="#263440" font-size="24" font-weight="400">kontrolliert die Bundesregierung.</text><rect x="40" y="631.6" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="667.6" fill="#214d7c" font-size="28" font-weight="700">Bundesrat</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">Vertretung der Landesregierungen. Wirkt an</text><text x="58" y="738.8000000000001" fill="#263440" font-size="24" font-weight="400">Bundesgesetzen und weiteren Bundesangelegenheiten mit.</text><rect x="40" y="792" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="828" fill="#214d7c" font-size="28" font-weight="700">Bundesregierung</text><text x="58" y="868" fill="#263440" font-size="24" font-weight="400">Bundeskanzler und Bundesminister. Leitet die Politik</text><text x="58" y="899.2" fill="#263440" font-size="24" font-weight="400">und führt die Regierungsgeschäfte.</text><rect x="40" y="952.4" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="988.4" fill="#214d7c" font-size="28" font-weight="700">Bundespräsident</text><text x="58" y="1028.4" fill="#263440" font-size="24" font-weight="400">Staatsoberhaupt. Repräsentiert Deutschland, nimmt</text><text x="58" y="1059.6000000000001" fill="#263440" font-size="24" font-weight="400">Ernennungen vor und fertigt Bundesgesetze nach Prüfung</text><text x="58" y="1090.8000000000002" fill="#263440" font-size="24" font-weight="400">aus.</text><rect x="40" y="1144" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1180" fill="#214d7c" font-size="28" font-weight="700">Bundesverfassungsgericht</text><text x="58" y="1220" fill="#263440" font-size="24" font-weight="400">Prüft wichtige Verfassungsfragen. Ist unabhängig von</text><text x="58" y="1251.2" fill="#263440" font-size="24" font-weight="400">der Regierung und vom Parlament.</text></g></svg>