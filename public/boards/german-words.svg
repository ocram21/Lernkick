<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1409" viewBox="0 0 800 1409" role="img"><title>Wortarten</title><desc>Wortarten sagen, welche Aufgabe ein Wort haben kann.</desc><rect width="800" height="1409" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Wortarten</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Wortarten sagen, welche Aufgabe ein Wort haben kann.</text><g transform="translate(0 50)"><rect x="40" y="145" width="290" height="62" rx="8" fill="#e0e9f4"/><rect x="345" y="145" width="130" height="62" rx="8" fill="#d8ebe1"/><rect x="490" y="145" width="270" height="62" rx="8" fill="#f3e3d1"/><text x="62" y="186" fill="#263440" font-size="29" font-weight="400">Die Schülerin</text><text x="373" y="186" fill="#263440" font-size="29" font-weight="400">liest</text><text x="530" y="186" fill="#263440" font-size="29" font-weight="400">das Buch.</text><text x="62" y="240" fill="#214d7c" font-size="23" font-weight="400">Subjekt</text><text x="343" y="240" fill="#196246" font-size="23" font-weight="400">Prädikat</text><text x="515" y="240" fill="#865021" font-size="23" font-weight="400">Akkusativobjekt</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Nomen</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Nennen Lebewesen, Dinge oder Vorstellungen. Sie haben</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">oft einen Artikel und werden großgeschrieben.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">der Hund · die Schule · das Glück</text><rect x="40" y="629.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Verb</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">Bezeichnet Tätigkeiten, Vorgänge oder Zustände. Es wird</text><text x="58" y="736.6" fill="#263440" font-size="24" font-weight="400">an Person und Zeit angepasst.</text><text x="58" y="779.8" fill="#196246" font-size="24" font-weight="600">lernen → ich lerne · er lernte</text><rect x="40" y="818.8" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="854.8" fill="#214d7c" font-size="28" font-weight="700">Adjektiv</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">Beschreibt, wie etwas ist. Viele Adjektive lassen sich</text><text x="58" y="926" fill="#263440" font-size="24" font-weight="400">steigern.</text><text x="58" y="969.1999999999999" fill="#196246" font-size="24" font-weight="600">groß → größer → am größten</text><rect x="40" y="1008.1999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1044.1999999999998" fill="#214d7c" font-size="28" font-weight="700">Artikel und Pronomen</text><text x="58" y="1084.1999999999998" fill="#263440" font-size="24" font-weight="400">Artikel begleiten Nomen. Pronomen ersetzen oder</text><text x="58" y="1115.3999999999999" fill="#263440" font-size="24" font-weight="400">begleiten sie.</text><text x="58" y="1158.6" fill="#196246" font-size="24" font-weight="600">der, eine · ich, sie, mein</text><rect x="40" y="1197.6" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1233.6" fill="#214d7c" font-size="28" font-weight="700">Präposition und Konjunktion</text><text x="58" y="1273.6" fill="#263440" font-size="24" font-weight="400">Präpositionen zeigen Beziehungen; Konjunktionen</text><text x="58" y="1304.8" fill="#263440" font-size="24" font-weight="400">verbinden Wörter oder Sätze.</text><text x="58" y="1348" fill="#196246" font-size="24" font-weight="600">auf, mit, wegen · und, weil, dass</text></g></svg>