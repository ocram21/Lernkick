<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1125" viewBox="0 0 800 1125" role="img"><title>Körper und Volumen</title><desc>V ist das Volumen, O die Oberfläche. h ist die senkrechte Höhe.</desc><rect width="800" height="1125" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Körper und Volumen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">V ist das Volumen, O die Oberfläche. h ist die senkrechte Höhe.</text><rect x="40" y="150" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="186" fill="#214d7c" font-size="24" font-weight="700">Würfel</text><g transform="translate(115,202)"><path d="M35 30L125 30L155 5L65 5ZM35 30V105H125V30M125 105L155 80V5M35 105L65 80H155M65 5V80" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><text x="70" y="125" fill="#263440" font-size="19" font-weight="400">a</text></g><text x="58" y="355" fill="#263440" font-size="20" font-weight="400">Alle Kanten haben die Länge</text><text x="58" y="381" fill="#263440" font-size="20" font-weight="400">a.</text><text x="58" y="419" fill="#196246" font-size="19" font-weight="600">V = a³ · O = 6a²</text><rect x="409" y="150" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="427" y="186" fill="#214d7c" font-size="24" font-weight="700">Quader</text><g transform="translate(484,202)"><path d="M15 35H140L175 8H50ZM15 35V95H140V35M140 95L175 68V8M15 95L50 68H175M50 8V68" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><text x="65" y="119" fill="#263440" font-size="19" font-weight="400">a</text><text x="161" y="96" fill="#263440" font-size="19" font-weight="400">b</text><text x="0" y="71" fill="#263440" font-size="19" font-weight="400">c</text></g><text x="427" y="355" fill="#263440" font-size="20" font-weight="400">a, b und c sind die drei</text><text x="427" y="381" fill="#263440" font-size="20" font-weight="400">Kantenlängen.</text><text x="427" y="419" fill="#196246" font-size="19" font-weight="600">V = a·b·c · O = 2(ab+ac+bc)</text><rect x="40" y="470" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="506" fill="#214d7c" font-size="24" font-weight="700">Zylinder</text><g transform="translate(115,522)"><path d="M45 20V100C45 122 145 122 145 100V20" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><ellipse cx="95" cy="20" rx="50" ry="17" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><path d="M95 20L145 20" fill="none" stroke="#32627c" stroke-width="3"/><text x="111" y="14" fill="#263440" font-size="18" font-weight="400">r</text><text x="155" y="70" fill="#263440" font-size="20" font-weight="400">h</text></g><text x="58" y="675" fill="#263440" font-size="20" font-weight="400">Zwei Kreisflächen und eine</text><text x="58" y="701" fill="#263440" font-size="20" font-weight="400">Mantelfläche.</text><text x="58" y="739" fill="#196246" font-size="19" font-weight="600">V = πr²h · O = 2πr²+2πrh</text><rect x="409" y="470" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="427" y="506" fill="#214d7c" font-size="24" font-weight="700">Kegel</text><g transform="translate(484,522)"><path d="M95 2L35 100Q95 132 155 100Z" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><ellipse cx="95" cy="100" rx="60" ry="20" fill="none" stroke="#32627c" stroke-width="3"/><path d="M95 2L95 100" fill="none" stroke="#32627c" stroke-width="3"/><text x="102" y="64" fill="#263440" font-size="18" font-weight="400">h</text><text x="145" y="56" fill="#263440" font-size="18" font-weight="400">s</text></g><text x="427" y="675" fill="#263440" font-size="20" font-weight="400">s ist die schräge</text><text x="427" y="701" fill="#263440" font-size="20" font-weight="400">Mantellinie.</text><text x="427" y="739" fill="#196246" font-size="19" font-weight="600">V = πr²h/3 · O = πr²+πrs</text><rect x="40" y="790" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="826" fill="#214d7c" font-size="24" font-weight="700">Pyramide</text><g transform="translate(115,842)"><path d="M95 2L20 95L110 120L175 75ZM95 2L110 120M20 95L85 65L175 75M95 2L85 65" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><path d="M95 2L95 95" fill="none" stroke="#32627c" stroke-width="3"/><text x="100" y="56" fill="#263440" font-size="18" font-weight="400">h</text></g><text x="58" y="995" fill="#263440" font-size="20" font-weight="400">G: Grundfläche, M:</text><text x="58" y="1021" fill="#263440" font-size="20" font-weight="400">Mantelfläche.</text><text x="58" y="1059" fill="#196246" font-size="19" font-weight="600">V = G·h/3 · O = G+M</text><rect x="409" y="790" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="427" y="826" fill="#214d7c" font-size="24" font-weight="700">Kugel</text><g transform="translate(484,842)"><circle cx="95" cy="57" r="53" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><ellipse cx="95" cy="57" rx="53" ry="17" fill="none" stroke="#32627c" stroke-width="2"/><path d="M95 57L148 57" fill="none" stroke="#32627c" stroke-width="3"/><text x="115" y="49" fill="#263440" font-size="19" font-weight="400">r</text></g><text x="427" y="995" fill="#263440" font-size="20" font-weight="400">r ist der Radius.</text><text x="427" y="1033" fill="#196246" font-size="19" font-weight="600">V = 4πr³/3 · O = 4πr²</text></g></svg>