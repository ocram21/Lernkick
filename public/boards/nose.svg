<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img"><title>Nase: So entsteht ein Geruch</title><desc>Beschriftetes Lernschema. Größen vereinfacht.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="700" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="35" y="50" font-size="30" fill="#203d49" text-anchor="start" font-weight="700">Nase: So entsteht ein Geruch</text><text x="35" y="100" font-size="24" fill="#203d49" text-anchor="start" font-weight="400">Duftstoffe gelangen mit der Luft in die Nase.</text><path d="M100 445V285Q100 205 180 205H365V440Z" stroke="#32627c" stroke-width="3" fill="#e4edf0"/><text x="155" y="390" font-size="26" fill="#203d49" text-anchor="start" font-weight="400">Nasenraum</text><rect x="200" y="210" width="155" height="28" fill="#ceaa64"/><text x="430" y="220" font-size="25" fill="#203d49" text-anchor="start" font-weight="400">Riechschleimhaut</text><path d="M355 224H410" stroke="#32627c" stroke-width="3" fill="none"/><text x="430" y="250" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">mit Riechzellen</text><path d="M250 210V145H725V275H590V285" stroke="#32627c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="285" y="133" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Nervenfasern</text><rect x="430" y="290" width="320" height="75" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="455" y="325" font-size="25" fill="#203d49" text-anchor="start" font-weight="700">Riechkolben</text><text x="455" y="350" font-size="20" fill="#203d49" text-anchor="start" font-weight="400">verarbeitet erste Signale</text><path d="M590 365V415" stroke="#32627c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="425" width="320" height="75" rx="8" fill="#e0ece8" stroke="#718c87"/><text x="450" y="468" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Gehirn erkennt den Geruch</text><path d="M45 465H140V285H260V243" stroke="#28614e" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="35" y="520" font-size="23" fill="#28614e" text-anchor="start" font-weight="400">Duftstoffe + Luft</text><text x="35" y="580" font-size="24" fill="#203d49" text-anchor="start" font-weight="400">Riechzellen wandeln den Reiz in Nervensignale um.</text><text x="35" y="620" font-size="21" fill="#203d49" text-anchor="start" font-weight="400">Die Pfeile zeigen den Weg von Duftstoffen und Signalen.</text><text x="35" y="678" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">LernKick · eigenes, vereinfachtes Lernschema</text></g></svg>