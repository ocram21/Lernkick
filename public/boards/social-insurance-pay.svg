<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1547" viewBox="0 0 800 1547" role="img"><title>Sozialversicherung und Lohn</title><desc>Fünf Versicherungszweige sichern wichtige Lebensrisiken ab. Brutto ist nicht dasselbe wie Netto.</desc><rect width="800" height="1547" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Sozialversicherung und Lohn</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Fünf Versicherungszweige sichern wichtige Lebensrisiken ab. Brutto</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">ist nicht dasselbe wie Netto.</text><g transform="translate(0 50)"><text x="60" y="155" fill="#214d7c" font-size="31" font-weight="700">Brutto</text><text x="60" y="210" fill="#263440" font-size="26" font-weight="400">− Steuern und Beiträge</text><text x="60" y="275" fill="#196246" font-size="31" font-weight="700">= Netto</text><text x="500" y="155" fill="#263440" font-size="27" font-weight="700">5 Zweige</text><text x="440" y="200" fill="#263440" font-size="22" font-weight="400">Kranken · Pflege ·</text><text x="440" y="228.6" fill="#263440" font-size="22" font-weight="400">Rente · Arbeitslosen ·</text><text x="440" y="257.2" fill="#263440" font-size="22" font-weight="400">Unfall</text></g><rect x="40" y="440" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Kranken- und Pflegeversicherung</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Krankenversicherung hilft bei Krankheit.</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Pflegeversicherung beteiligt sich an Leistungen bei</text><text x="58" y="578.4" fill="#263440" font-size="24" font-weight="400">Pflegebedürftigkeit.</text><rect x="40" y="631.6" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="667.6" fill="#214d7c" font-size="28" font-weight="700">Rentenversicherung</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">Sichert insbesondere Alter und Erwerbsminderung ab und</text><text x="58" y="738.8000000000001" fill="#263440" font-size="24" font-weight="400">ermöglicht Rehabilitationsleistungen.</text><rect x="40" y="792" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="828" fill="#214d7c" font-size="28" font-weight="700">Arbeitslosenversicherung</text><text x="58" y="868" fill="#263440" font-size="24" font-weight="400">Unterstützt bei Arbeitslosigkeit unter den gesetzlichen</text><text x="58" y="899.2" fill="#263440" font-size="24" font-weight="400">Voraussetzungen und fördert Beschäftigung.</text><rect x="40" y="952.4" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="988.4" fill="#214d7c" font-size="28" font-weight="700">Unfallversicherung</text><text x="58" y="1028.4" fill="#263440" font-size="24" font-weight="400">Schützt bei versicherten Arbeits- und Wegeunfällen</text><text x="58" y="1059.6000000000001" fill="#263440" font-size="24" font-weight="400">sowie Berufskrankheiten. Beiträge trägt bei</text><text x="58" y="1090.8000000000002" fill="#263440" font-size="24" font-weight="400">Beschäftigten grundsätzlich der Arbeitgeber.</text><rect x="40" y="1144" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1180" fill="#214d7c" font-size="28" font-weight="700">Von Brutto zu Netto</text><text x="58" y="1220" fill="#263440" font-size="24" font-weight="400">Vom vereinbarten Brutto gehen gegebenenfalls Steuern</text><text x="58" y="1251.2" fill="#263440" font-size="24" font-weight="400">und Arbeitnehmerbeiträge ab. Das ergibt Netto.</text><text x="58" y="1294.4" fill="#196246" font-size="24" font-weight="600">Reines Rechenbeispiel: 2000 € − 400 € Abzüge = 1600 €</text><rect x="40" y="1333.4" width="720" height="173.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1369.4" fill="#214d7c" font-size="28" font-weight="700">Abrechnung lesen</text><text x="58" y="1409.4" fill="#263440" font-size="24" font-weight="400">Zeitraum, Brutto, einzelne Abzüge und Netto prüfen. Die</text><text x="58" y="1440.6000000000001" fill="#263440" font-size="24" font-weight="400">tatsächlichen Abzüge hängen vom Einzelfall ab; die</text><text x="58" y="1471.8000000000002" fill="#263440" font-size="24" font-weight="400">Beispielbeträge sind keine Beitragssätze.</text></g></svg>