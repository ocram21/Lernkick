<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1192.8" viewBox="0 0 800 1192.8" role="img"><title>Karten lesen</title><desc>Himmelsrichtungen, Legende, Maßstab und Koordinaten helfen bei der Orientierung.</desc><rect width="800" height="1192.8" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Karten lesen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Himmelsrichtungen, Legende, Maßstab und Koordinaten helfen bei der</text><text x="40" y="129.3" fill="#45565f" font-size="21" font-weight="400">Orientierung.</text><g transform="translate(0 50)"><path d="M170 120L170 295" fill="none" stroke="#32627c" stroke-width="3"/><path d="M90 205L250 205" fill="none" stroke="#32627c" stroke-width="3"/><text x="160" y="105" fill="#263440" font-size="24" font-weight="400">N</text><text x="265" y="215" fill="#263440" font-size="24" font-weight="400">O</text><text x="160" y="325" fill="#263440" font-size="24" font-weight="400">S</text><text x="55" y="215" fill="#263440" font-size="24" font-weight="400">W</text><path d="M430 150L430 290" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M430 150L610 150" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M490 150L490 290" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M430 195L610 195" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M550 150L550 290" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M430 240L610 240" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M610 150L610 290" fill="none" stroke="#a4b8c4" stroke-width="2"/><path d="M430 285L610 285" fill="none" stroke="#a4b8c4" stroke-width="2"/><text x="400" y="328" fill="#263440" font-size="21" font-weight="400">Breite: N / S</text><text x="400" y="360" fill="#263440" font-size="21" font-weight="400">Länge: O / W</text></g><rect x="40" y="440" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Himmelsrichtungen</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Nord, Ost, Süd, West. Auf vielen Karten liegt Norden</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">oben; prüfe den Nordpfeil.</text><rect x="40" y="600.4" width="720" height="142.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="636.4" fill="#214d7c" font-size="28" font-weight="700">Legende</text><text x="58" y="676.4" fill="#263440" font-size="24" font-weight="400">Erklärt Zeichen, Farben und Linien. Ein blaues Band</text><text x="58" y="707.6" fill="#263440" font-size="24" font-weight="400">kann einen Fluss darstellen; ein Punkt eine Stadt.</text><rect x="40" y="760.8" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="796.8" fill="#214d7c" font-size="28" font-weight="700">Maßstab</text><text x="58" y="836.8" fill="#263440" font-size="24" font-weight="400">1 : 50 000 bedeutet: 1 cm auf der Karte entspricht 50</text><text x="58" y="868" fill="#263440" font-size="24" font-weight="400">000 cm = 500 m in Wirklichkeit.</text><text x="58" y="911.1999999999999" fill="#196246" font-size="24" font-weight="600">2 cm auf der Karte → 1 km in Wirklichkeit</text><rect x="40" y="950.1999999999999" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="986.1999999999999" fill="#214d7c" font-size="28" font-weight="700">Koordinaten</text><text x="58" y="1026.1999999999998" fill="#263440" font-size="24" font-weight="400">Breitengrade beschreiben die Lage nördlich oder südlich</text><text x="58" y="1057.3999999999999" fill="#263440" font-size="24" font-weight="400">des Äquators; Längengrade östlich oder westlich des</text><text x="58" y="1088.6" fill="#263440" font-size="24" font-weight="400">Nullmeridians.</text><text x="58" y="1131.7999999999997" fill="#196246" font-size="24" font-weight="600">Berlin etwa 52,5° N und 13,4° O</text></g></svg>