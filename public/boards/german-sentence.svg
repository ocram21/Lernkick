<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1377.8000000000002" viewBox="0 0 800 1377.8000000000002" role="img"><title>Satzbau, Satzglieder und Nebensätze</title><desc>Satzglieder können aus mehreren Wörtern bestehen.</desc><rect width="800" height="1377.8000000000002" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Satzbau, Satzglieder und Nebensätze</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Satzglieder können aus mehreren Wörtern bestehen.</text><g transform="translate(0 50)"><rect x="40" y="145" width="290" height="62" rx="8" fill="#e0e9f4"/><rect x="345" y="145" width="130" height="62" rx="8" fill="#d8ebe1"/><rect x="490" y="145" width="270" height="62" rx="8" fill="#f3e3d1"/><text x="62" y="186" fill="#263440" font-size="29" font-weight="400">Die Schülerin</text><text x="373" y="186" fill="#263440" font-size="29" font-weight="400">liest</text><text x="530" y="186" fill="#263440" font-size="29" font-weight="400">das Buch.</text><text x="62" y="240" fill="#214d7c" font-size="23" font-weight="400">Subjekt</text><text x="343" y="240" fill="#196246" font-size="23" font-weight="400">Prädikat</text><text x="515" y="240" fill="#865021" font-size="23" font-weight="400">Akkusativobjekt</text></g><rect x="40" y="440" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Subjekt</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Wer oder was tut etwas? Im Beispiel: Die Schülerin.</text><text x="58" y="559.2" fill="#196246" font-size="24" font-weight="600">Die Schülerin | liest | das Buch.</text><rect x="40" y="598.2" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="634.2" fill="#214d7c" font-size="28" font-weight="700">Prädikat und Objekt</text><text x="58" y="674.2" fill="#263440" font-size="24" font-weight="400">Das Prädikat nennt das Geschehen: liest. Nach dem</text><text x="58" y="705.4000000000001" fill="#263440" font-size="24" font-weight="400">Akkusativobjekt fragst du Wen oder was?: das Buch.</text><text x="58" y="748.6" fill="#196246" font-size="24" font-weight="600">Wer? → Die Schülerin · Was tut sie? → liest</text><rect x="40" y="787.6" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="823.6" fill="#214d7c" font-size="28" font-weight="700">Hauptsatz</text><text x="58" y="863.6" fill="#263440" font-size="24" font-weight="400">Im Aussagesatz steht das gebeugte Verb meist an zweiter</text><text x="58" y="894.8000000000001" fill="#263440" font-size="24" font-weight="400">Satzgliedstelle.</text><text x="58" y="938" fill="#196246" font-size="24" font-weight="600">Heute liest die Schülerin ein Buch.</text><rect x="40" y="977" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1013" fill="#214d7c" font-size="28" font-weight="700">Nebensatz</text><text x="58" y="1053" fill="#263440" font-size="24" font-weight="400">Ein Nebensatz mit weil oder dass hat das gebeugte Verb</text><text x="58" y="1084.2" fill="#263440" font-size="24" font-weight="400">am Ende. Ein Komma trennt ihn vom Hauptsatz.</text><text x="58" y="1127.4" fill="#196246" font-size="24" font-weight="600">Sie liest, weil sie die Geschichte mag.</text><rect x="40" y="1166.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1202.4" fill="#214d7c" font-size="28" font-weight="700">Satzglieder finden</text><text x="58" y="1242.4" fill="#263440" font-size="24" font-weight="400">Mit Fragen und der Umstellprobe arbeiten. Zusammen</text><text x="58" y="1273.6000000000001" fill="#263440" font-size="24" font-weight="400">verschiebbare Wortgruppen bilden oft ein Satzglied.</text><text x="58" y="1316.8000000000002" fill="#196246" font-size="24" font-weight="600">Das Buch liest die Schülerin heute.</text></g></svg>