<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1125" viewBox="0 0 800 1125" role="img"><title>Flächen und Umfang</title><desc>Wichtige ebene Figuren. U ist der Umfang, A der Flächeninhalt.</desc><rect width="800" height="1125" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Flächen und Umfang</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Wichtige ebene Figuren. U ist der Umfang, A der Flächeninhalt.</text><rect x="40" y="150" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="186" fill="#214d7c" font-size="24" font-weight="700">Quadrat</text><g transform="translate(115,202)"><rect x="40" y="5" width="90" height="90" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><text x="80" y="117" fill="#263440" font-size="20" font-weight="400">a</text></g><text x="58" y="355" fill="#263440" font-size="20" font-weight="400">Alle Seiten sind gleich lang.</text><text x="58" y="393" fill="#196246" font-size="19" font-weight="600">U = 4a · A = a²</text><rect x="409" y="150" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="427" y="186" fill="#214d7c" font-size="24" font-weight="700">Rechteck</text><g transform="translate(484,202)"><rect x="15" y="20" width="150" height="75" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><text x="85" y="119" fill="#263440" font-size="20" font-weight="400">a</text><text x="175" y="65" fill="#263440" font-size="20" font-weight="400">b</text></g><text x="427" y="355" fill="#263440" font-size="20" font-weight="400">Gegenüberliegende Seiten sind</text><text x="427" y="381" fill="#263440" font-size="20" font-weight="400">gleich lang.</text><text x="427" y="419" fill="#196246" font-size="19" font-weight="600">U = 2a + 2b · A = a·b</text><rect x="40" y="470" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="506" fill="#214d7c" font-size="24" font-weight="700">Dreieck</text><g transform="translate(115,522)"><path d="M5 95L180 95L65 5Z" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><path d="M65 5L65 95" fill="none" stroke="#32627c" stroke-width="3"/><text x="74" y="57" fill="#263440" font-size="19" font-weight="400">hₐ</text><text x="92" y="119" fill="#263440" font-size="20" font-weight="400">a</text></g><text x="58" y="675" fill="#263440" font-size="20" font-weight="400">hₐ steht senkrecht auf der</text><text x="58" y="701" fill="#263440" font-size="20" font-weight="400">Seite a.</text><text x="58" y="739" fill="#196246" font-size="19" font-weight="600">U = a+b+c · A = a·hₐ/2</text><rect x="409" y="470" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="427" y="506" fill="#214d7c" font-size="24" font-weight="700">Kreis</text><g transform="translate(484,522)"><circle cx="90" cy="53" r="48" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><path d="M90 53L138 53" fill="none" stroke="#32627c" stroke-width="3"/><text x="109" y="45" fill="#263440" font-size="20" font-weight="400">r</text></g><text x="427" y="675" fill="#263440" font-size="20" font-weight="400">r ist der Radius; d = 2r.</text><text x="427" y="713" fill="#196246" font-size="19" font-weight="600">U = 2πr · A = πr²</text><rect x="40" y="790" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="826" fill="#214d7c" font-size="24" font-weight="700">Parallelogramm</text><g transform="translate(115,842)"><path d="M5 95L145 95L180 5L40 5Z" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><path d="M40 5L40 95" fill="none" stroke="#32627c" stroke-width="3"/><text x="48" y="62" fill="#263440" font-size="18" font-weight="400">hₐ</text><text x="85" y="117" fill="#263440" font-size="20" font-weight="400">a</text></g><text x="58" y="995" fill="#263440" font-size="20" font-weight="400">Für die Fläche zählt die</text><text x="58" y="1021" fill="#263440" font-size="20" font-weight="400">senkrechte Höhe.</text><text x="58" y="1059" fill="#196246" font-size="19" font-weight="600">U = 2a+2b · A = a·hₐ</text><rect x="409" y="790" width="351" height="302" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="427" y="826" fill="#214d7c" font-size="24" font-weight="700">Trapez</text><g transform="translate(484,842)"><path d="M5 95L185 95L145 5L45 5Z" fill="#dcecf0" stroke="#32627c" stroke-width="3"/><path d="M45 5L45 95" fill="none" stroke="#32627c" stroke-width="3"/><text x="90" y="117" fill="#263440" font-size="20" font-weight="400">a</text><text x="90" y="0" fill="#263440" font-size="20" font-weight="400">c</text><text x="52" y="55" fill="#263440" font-size="18" font-weight="400">h</text></g><text x="427" y="995" fill="#263440" font-size="20" font-weight="400">Die Seiten a und c sind</text><text x="427" y="1021" fill="#263440" font-size="20" font-weight="400">parallel.</text><text x="427" y="1059" fill="#196246" font-size="19" font-weight="600">U = a+b+c+d · A = (a+c)·h/2</text></g></svg>