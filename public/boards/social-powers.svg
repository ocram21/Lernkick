<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1219.6" viewBox="0 0 800 1219.6" role="img"><title>Gewaltenteilung</title><desc>Macht wird verteilt und gegenseitig kontrolliert.</desc><rect width="800" height="1219.6" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Gewaltenteilung</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Macht wird verteilt und gegenseitig kontrolliert.</text><g transform="translate(0 50)"><rect x="35" y="150" width="220" height="85" rx="9" fill="#dfe9f3"/><text x="50" y="185" fill="#263440" font-size="25" font-weight="700">Gesetze</text><text x="260" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="290" y="150" width="220" height="85" rx="9" fill="#dcece3"/><text x="305" y="185" fill="#263440" font-size="25" font-weight="700">Ausführen</text><text x="515" y="200" fill="#263440" font-size="28" font-weight="400">→</text><rect x="545" y="150" width="220" height="85" rx="9" fill="#f3e6d5"/><text x="560" y="185" fill="#263440" font-size="25" font-weight="700">Recht sprechen</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">Legislative – Gesetze</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Parlamente beschließen Gesetze. Im Bund wirken</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Bundestag und Bundesrat an der Gesetzgebung mit.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">Beispiel: ein neues Gesetz beraten</text><rect x="40" y="629.4" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">Exekutive – Ausführen</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">Regierung und Verwaltung setzen Gesetze um.</text><text x="58" y="748.6" fill="#196246" font-size="24" font-weight="600">Beispiel: eine Behörde bearbeitet einen Antrag</text><rect x="40" y="787.5999999999999" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="823.5999999999999" fill="#214d7c" font-size="28" font-weight="700">Judikative – Recht sprechen</text><text x="58" y="863.5999999999999" fill="#263440" font-size="24" font-weight="400">Unabhängige Gerichte entscheiden Rechtsstreitigkeiten</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">und prüfen Rechtsfragen.</text><text x="58" y="937.9999999999999" fill="#196246" font-size="24" font-weight="600">Beispiel: ein Gericht entscheidet über eine Klage</text><rect x="40" y="976.9999999999999" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="1012.9999999999999" fill="#214d7c" font-size="28" font-weight="700">Kontrolle</text><text x="58" y="1053" fill="#263440" font-size="24" font-weight="400">Die drei Bereiche sind getrennt, aber auch miteinander</text><text x="58" y="1084.2" fill="#263440" font-size="24" font-weight="400">verbunden. Der Bundestag kontrolliert die</text><text x="58" y="1115.4" fill="#263440" font-size="24" font-weight="400">Bundesregierung.</text><text x="58" y="1158.6" fill="#196246" font-size="24" font-weight="600">Kein Bereich darf beliebig alles allein entscheiden.</text></g></svg>