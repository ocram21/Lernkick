<svg xmlns="http://www.w3.org/2000/svg" width="800" height="820" viewBox="0 0 800 820" role="img"><title>Gewaltenteilung: Macht verteilen</title><desc>Beschriftetes Lernschema. Größen vereinfacht.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="800" height="820" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="35" y="50" font-size="30" fill="#203d49" text-anchor="start" font-weight="700">Gewaltenteilung: Macht verteilen</text><text x="35" y="105" font-size="24" fill="#203d49" text-anchor="start" font-weight="400">Staatliche Macht hat verschiedene Aufgaben.</text><rect x="40" y="150" width="720" height="130" rx="8" fill="#e0e8f0" stroke="#718c87"/><text x="65" y="188" font-size="28" fill="#203d49" text-anchor="start" font-weight="700">Gesetzgebung</text><text x="65" y="225" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Parlamente</text><text x="65" y="258" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Ein Gesetz beraten und beschließen</text><rect x="40" y="320" width="720" height="130" rx="8" fill="#e0ece3" stroke="#718c87"/><text x="65" y="358" font-size="28" fill="#203d49" text-anchor="start" font-weight="700">Ausführung</text><text x="65" y="395" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Regierung und Verwaltung</text><text x="65" y="428" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Ein Amt wendet das Gesetz an</text><rect x="40" y="490" width="720" height="130" rx="8" fill="#eee4d5" stroke="#718c87"/><text x="65" y="528" font-size="28" fill="#203d49" text-anchor="start" font-weight="700">Rechtsprechung</text><text x="65" y="565" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Unabhängige Gerichte</text><text x="65" y="598" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Ein Gericht entscheidet einen Streit</text><text x="40" y="710" font-size="23" fill="#203d49" text-anchor="start" font-weight="400">Die Bereiche begrenzen und kontrollieren sich gegenseitig.</text><text x="40" y="750" font-size="22" fill="#203d49" text-anchor="start" font-weight="400">Beispiel: Der Bundestag kontrolliert die Bundesregierung.</text><text x="35" y="798" font-size="17" fill="#203d49" text-anchor="start" font-weight="400">LernKick · eigenes, vereinfachtes Lernschema</text></g></svg>