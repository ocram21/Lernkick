<svg xmlns="http://www.w3.org/2000/svg" width="800" height="999" viewBox="0 0 800 999" role="img"><title>Schriftlich malnehmen und teilen</title><desc>Zwei vollständig gerechnete Beispiele. Arbeite Stelle für Stelle.</desc><rect width="800" height="999" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Schriftlich malnehmen und teilen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Zwei vollständig gerechnete Beispiele. Arbeite Stelle für Stelle.</text><g transform="translate(0 50)"><text x="100" y="155" fill="#263440" font-size="30" font-weight="700">234 · 16</text><text x="100" y="200" fill="#263440" font-size="27" font-weight="400">1404 (·6)</text><text x="80" y="242" fill="#263440" font-size="27" font-weight="400">+2340 (·10)</text><path d="M70 258L350 258" fill="none" stroke="#32627c" stroke-width="3"/><text x="100" y="300" fill="#196246" font-size="31" font-weight="700">3744</text><text x="430" y="155" fill="#263440" font-size="29" font-weight="700">936 : 4 = 234</text><text x="430" y="205" fill="#263440" font-size="24" font-weight="400">9−8=1 → 13</text><text x="430" y="248" fill="#263440" font-size="24" font-weight="400">13−12=1 → 16</text><text x="430" y="291" fill="#263440" font-size="24" font-weight="400">16−16=0</text></g><rect x="40" y="440" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="476" fill="#214d7c" font-size="28" font-weight="700">234 · 16</text><text x="58" y="516" fill="#263440" font-size="24" font-weight="400">Zuerst mit 6, dann mit 10 multiplizieren. Die</text><text x="58" y="547.2" fill="#263440" font-size="24" font-weight="400">Teilprodukte stellenrichtig addieren.</text><text x="58" y="590.4" fill="#196246" font-size="24" font-weight="600">234·6 = 1404 | 234·10 = 2340 | 1404+2340 = 3744</text><rect x="40" y="629.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="665.4" fill="#214d7c" font-size="28" font-weight="700">936 : 4 = 234</text><text x="58" y="705.4" fill="#263440" font-size="24" font-weight="400">9:4 = 2 Rest 1. Die 3 herunterholen: 13:4 = 3 Rest 1.</text><text x="58" y="736.6" fill="#263440" font-size="24" font-weight="400">Die 6 herunterholen: 16:4 = 4 Rest 0.</text><text x="58" y="779.8" fill="#196246" font-size="24" font-weight="600">9−8=1 → 13−12=1 → 16−16=0</text><rect x="40" y="818.8" width="720" height="140.2" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="854.8" fill="#214d7c" font-size="28" font-weight="700">Probe</text><text x="58" y="894.8" fill="#263440" font-size="24" font-weight="400">Mit der Umkehraufgabe kontrollieren.</text><text x="58" y="938" fill="#196246" font-size="24" font-weight="600">234·4 = 936</text></g></svg>