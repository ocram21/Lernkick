<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650"><title>Jahreszeiten auf der Nordhalbkugel</title><rect width="800" height="650" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="35" y="55" fill="#18384b" font-size="30" font-weight="700">Jahreszeiten: Die Achse bleibt geneigt</text><text x="35" y="95" fill="#263440" font-size="20" font-weight="400">Schematisch: Erde, Sonne und Abstände nicht</text><text x="35" y="121" fill="#263440" font-size="20" font-weight="400">maßstäblich</text><ellipse cx="400" cy="315" rx="255" ry="175" fill="none" stroke="#b2c2c8" stroke-width="2" stroke-dasharray="7 7"/><circle cx="400" cy="315" r="52" fill="#f6d46a"/><text x="365" y="322" fill="#263440" font-size="23" font-weight="400">Sonne</text><circle cx="145" cy="315" r="35" fill="#85b4cf" stroke="#315a72" stroke-width="2"/><path d="M125 268L165 362" stroke="#27745a" stroke-width="4"/><circle cx="655" cy="315" r="35" fill="#85b4cf" stroke="#315a72" stroke-width="2"/><path d="M635 268L675 362" stroke="#27745a" stroke-width="4"/><circle cx="400" cy="140" r="35" fill="#85b4cf" stroke="#315a72" stroke-width="2"/><path d="M380 93L420 187" stroke="#27745a" stroke-width="4"/><circle cx="400" cy="490" r="35" fill="#85b4cf" stroke="#315a72" stroke-width="2"/><path d="M380 443L420 537" stroke="#27745a" stroke-width="4"/><text x="60" y="410" fill="#263440" font-size="24" font-weight="400">Dezember</text><text x="60" y="442" fill="#263440" font-size="22" font-weight="400">Nord: Winter</text><text x="595" y="410" fill="#263440" font-size="24" font-weight="400">Juni</text><text x="572" y="442" fill="#263440" font-size="22" font-weight="400">Nord: Sommer</text><text x="500" y="155" fill="#263440" font-size="23" font-weight="400">September</text><text x="490" y="500" fill="#263440" font-size="23" font-weight="400">März</text><text x="35" y="580" fill="#196246" font-size="22" font-weight="400">Nordhalbkugel zur Sonne geneigt → höhere Sonne, längere Tage.</text><text x="35" y="615" fill="#263440" font-size="21" font-weight="400">Auf der Südhalbkugel sind Sommer und Winter vertauscht.</text></g></svg>