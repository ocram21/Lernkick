<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1150.2" viewBox="0 0 800 1150.2" role="img"><title>Richtig schreiben und Satzzeichen</title><desc>Kurze Grundregeln mit Beispielen.</desc><rect width="800" height="1150.2" fill="#f7f7f0"/><g font-family="Arial,sans-serif"><text x="40" y="58" fill="#18384b" font-size="34" font-weight="700">Richtig schreiben und Satzzeichen</text><text x="40" y="102" fill="#45565f" font-size="21" font-weight="400">Kurze Grundregeln mit Beispielen.</text><rect x="40" y="150" width="720" height="202.60000000000002" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="186" fill="#214d7c" font-size="28" font-weight="700">Groß und klein</text><text x="58" y="226" fill="#263440" font-size="24" font-weight="400">Satzanfänge und Nomen schreibt man groß. Verben und</text><text x="58" y="257.2" fill="#263440" font-size="24" font-weight="400">Adjektive meist klein: Das Kind liest ein spannendes</text><text x="58" y="288.4" fill="#263440" font-size="24" font-weight="400">Buch.</text><text x="58" y="331.6" fill="#196246" font-size="24" font-weight="600">das Lesen · etwas Neues</text><rect x="40" y="370.6" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="406.6" fill="#214d7c" font-size="28" font-weight="700">Punkt, Fragezeichen, Ausrufezeichen</text><text x="58" y="446.6" fill="#263440" font-size="24" font-weight="400">Ein Aussagesatz endet mit einem Punkt. Eine Frage mit</text><text x="58" y="477.8" fill="#263440" font-size="24" font-weight="400">?, ein Ausruf oder eine Aufforderung kann mit ! enden.</text><text x="58" y="521" fill="#196246" font-size="24" font-weight="600">Ich komme. · Kommst du? · Achtung!</text><rect x="40" y="560" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="596" fill="#214d7c" font-size="28" font-weight="700">Komma</text><text x="58" y="636" fill="#263440" font-size="24" font-weight="400">Kommas trennen zum Beispiel Aufzählungen und Haupt- von</text><text x="58" y="667.2" fill="#263440" font-size="24" font-weight="400">Nebensätzen.</text><text x="58" y="710.4" fill="#196246" font-size="24" font-weight="600">Ich brauche Stifte, Papier und eine Mappe.</text><rect x="40" y="749.4" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="785.4" fill="#214d7c" font-size="28" font-weight="700">das oder dass?</text><text x="58" y="825.4" fill="#263440" font-size="24" font-weight="400">das kann Artikel oder Pronomen sein: das Buch; das</text><text x="58" y="856.6" fill="#263440" font-size="24" font-weight="400">Buch, das ich lese. dass leitet einen Nebensatz ein.</text><text x="58" y="899.8" fill="#196246" font-size="24" font-weight="600">Ich hoffe, dass du kommst.</text><rect x="40" y="938.8" width="720" height="171.4" rx="10" fill="#fff" stroke="#c8d5d9"/><text x="58" y="974.8" fill="#214d7c" font-size="28" font-weight="700">Eine Hilfe für das</text><text x="58" y="1014.8" fill="#263440" font-size="24" font-weight="400">Kannst du dieses, jenes oder welches einsetzen? Dann</text><text x="58" y="1046" fill="#263440" font-size="24" font-weight="400">passt meist das.</text><text x="58" y="1089.2" fill="#196246" font-size="24" font-weight="600">Das Buch, welches ich lese, ist spannend.</text></g></svg>